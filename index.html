<!DOCTYPE html>
<html lang="de" data-theme="dark"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mein Depot Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.32.0/plotly.min.js"></script><style id="plotly.js-style-global"></style><style id="plotly.js-style-global"></style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.bare.min.js"></script>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --border: #e5e9f0;
    --text: #0f172a; --muted: #64748b; --accent: #2563eb; --accent-light: #eff6ff;
    --positive: #16a34a; --negative: #dc2626; --hover-bg: #f8fafc;
    --info-bg: #f1f5f9; --info-text: #475569;
    --success-bg: #f0fdf4; --success-text: #166534;
    --warn-bg: #fffbeb; --warn-text: #92400e; --warn-border: #fde68a;
    --error-bg: #fef2f2; --error-text: #991b1b;
    --row-border: #f1f4f8; --muted-2: #cbd5e1;
    --plot-font: #1e293b; --plot-paper: rgba(0,0,0,0); --plot-grid: #e5e9f0;
  }
  html[data-theme="dark"] {
    --bg: #0b1220; --card: #161f32; --border: #2a3550;
    --text: #e7ecf5; --muted: #93a1bd; --accent: #5b8def; --accent-light: #16233d;
    --positive: #4ade80; --negative: #f87171; --hover-bg: #1c2740;
    --info-bg: #1c2740; --info-text: #b9c4de;
    --success-bg: #0f2a1c; --success-text: #6ee7a0;
    --warn-bg: #2c2410; --warn-text: #fbbf6a; --warn-border: #55440f;
    --error-bg: #2c1416; --error-text: #fca5a5;
    --row-border: #212c47; --muted-2: #3d4a6b;
    --plot-font: #e7ecf5; --plot-paper: rgba(0,0,0,0); --plot-grid: #2a3550;
  }
  html, body { background: var(--bg); }
  /* Scrollen wird bewusst auf body verlagert (nicht html/Viewport). In eingebetteten
     Mini-Browsern wie der "Documents"-App beobachtet die App-eigene Oberflaeche
     (Symbolleiste/Tableiste) das Scrollen des obersten Dokuments, um sich ein-/auszublenden -
     jede noch so kleine Layout-Verschiebung dort wird faelschlich als "Scroll nach oben"
     gewertet und blendet die App-Oberflaeche ein. Da html hier fix bleibt und nie selbst
     scrollt, hat die Host-App nichts, worauf sie reagieren koennte. */
  html { height: 100%; overflow: hidden; }
  body { height: 100vh; height: 100dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
  body { transition: background-color .15s, color .15s; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 28px 20px 60px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  header h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .header-actions { display: flex; gap: 8px; }
  .btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 12.5px;
    padding: 8px 14px; border-radius: 999px; cursor: pointer; font-weight: 600;
  }
  .btn:hover { border-color: var(--muted-2); background: var(--hover-bg); }
  .btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.danger-outline { color: var(--negative); border-color: var(--warn-border); }
  .btn.danger-outline:hover { background: var(--error-bg); }
  a.btn { display: inline-block; text-decoration: none; }

  .backup-fallback { margin-top: 14px; padding: 14px; background: var(--info-bg); border: 1px solid var(--border); border-radius: 10px; }
  .backup-fallback .bf-title { font-size: 12.5px; font-weight: 700; color: var(--info-text); margin-bottom: 6px; }
  .backup-fallback .bf-hint { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 8px; }
  .backup-fallback textarea {
    width: 100%; min-height: 100px; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-family: 'SF Mono', Menlo, Consolas, monospace;
    font-size: 11px; resize: vertical; box-sizing: border-box;
  }
  .backup-fallback .bf-actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }

  .dropzone {
    border: 2px dashed #cbd5e1; border-radius: 12px; padding: 20px; text-align: center;
    background: var(--card); cursor: pointer; margin-bottom: 14px; transition: all .15s;
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-light); }
  .dropzone .icon { font-size: 24px; margin-bottom: 4px; }
  .dropzone .main { font-size: 14px; font-weight: 600; }
  .dropzone .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  input[type=file] { display: none; }

  .log {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    z-index: 1000; width: min(92vw, 460px);
    display: flex; flex-direction: column-reverse; gap: 6px;
    pointer-events: none; margin-bottom: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .log-entry {
    font-size: 12.5px; padding: 8px 12px; border-radius: 8px; line-height: 1.4;
    pointer-events: auto; box-shadow: 0 4px 18px rgba(0,0,0,0.18);
  }
  .log-entry.info { background: var(--info-bg); color: var(--info-text); }
  .log-entry.success { background: var(--success-bg); color: var(--success-text); }
  .log-entry.warn { background: var(--warn-bg); color: var(--warn-text); }
  .log-entry.error { background: var(--error-bg); color: var(--error-text); }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(15,23,42,0.04); }
  .kpi .label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .kpi .value { font-size: 19px; font-weight: 700; }

  .hero-card {
    background: var(--card);
    border: 1px solid var(--border); border-radius: 16px; padding: 24px 26px 6px;
    margin-bottom: 18px; box-shadow: 0 1px 2px rgba(15,23,42,0.04);
  }
  .hero-label { font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .hero-value { font-size: 42px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .hero-badge {
    display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 700; padding: 5px 12px;
    border-radius: 999px; background: var(--success-bg); color: var(--success-text);
  }
  .hero-badge.negative { background: var(--error-bg); color: var(--negative); }
  .hero-badge.positive { background: var(--success-bg); color: var(--positive); }
  .est-badge { font-size: 10px; font-weight: 600; opacity: .75; margin-left: 6px; }
  .hero-stats { display: flex; gap: 28px; margin: 20px 0 16px; flex-wrap: wrap; }
  .hero-stat .hs-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
  .hero-stat .hs-value { font-size: 16px; font-weight: 700; }
  .hero-stat .hs-value.positive { color: var(--positive); }
  .hero-stat .hs-value.negative { color: var(--negative); }
  .kpi .value.positive { color: var(--positive); }
  .kpi .value.negative { color: var(--negative); }
  .kpi .value.muted { color: var(--muted-2); font-size: 15px; font-weight: 600; }
  .kpi .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 20px 22px; box-shadow: 0 1px 2px rgba(15,23,42,0.04); margin-bottom: 16px; }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0 0 12px; color: var(--text); }
  .card h2.card-toggle-header {
    cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: space-between;
    margin: 0; padding: 2px 0;
  }
  .card h2.card-toggle-header:hover { color: var(--accent); }
  .card-toggle-icon { font-size: 11px; color: var(--muted); transition: transform 0.15s; margin-left: 10px; flex-shrink: 0; }
  .card h2.card-toggle-header.collapsed .card-toggle-icon { color: var(--accent); }
  .card-body { margin-top: 12px; }

  .note-collapsed-wrap { margin-top: 14px; display: flex; }
  .note-icon-toggle {
    background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text);
    width: 32px; height: 32px; border-radius: 50%; font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0; line-height: 1;
  }
  .note-icon-toggle:hover { filter: brightness(1.08); }
  .note-bubble { margin-top: 8px; animation: note-fade-in 0.15s ease; }
  @keyframes note-fade-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .card h2.card-toggle-header.collapsed { margin-bottom: 0; }
  .card h2 .sub-h2 { font-weight: 400; color: var(--muted); font-size: 12.5px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  tfoot td { border-top: 2px solid var(--border); border-bottom: none; padding-top: 10px; }
  td { padding: 9px 8px; border-bottom: 1px solid var(--row-border); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.mono { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 11.5px; color: var(--muted); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; }
  .del-btn { border: none; background: none; color: var(--muted-2); cursor: pointer; font-size: 15px; padding: 2px 6px; border-radius: 6px; }
  .del-btn:hover { color: var(--negative); background: var(--error-bg); }
  .note { font-size: 12.5px; color: var(--warn-text); line-height: 1.5; margin-top: 14px; padding: 12px 14px; background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 10px; }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
  footer { margin-top: 20px; font-size: 12px; color: var(--muted); text-align: center; }

  .deposit-form { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; padding: 14px; background: var(--hover-bg); border-radius: 10px; border: 1px solid var(--border); }
  .deposit-form .field { display: flex; flex-direction: column; gap: 4px; }
  .deposit-form label { font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .deposit-form input { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; font-family: inherit; background: var(--card); color: var(--text); }
  .deposit-form input[type=date] { min-width: 150px; }
  .deposit-form input[type=number] { width: 130px; }
  .deposit-form input[type=text] { width: 180px; }
  .deposit-form select { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; font-family: inherit; background: var(--card); color: var(--text); min-width: 200px; }

  .depot-select {
    border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 13px; font-weight: 600;
    padding: 8px 12px; border-radius: 999px; cursor: pointer;
  }
  .theme-toggle {
    border: 1px solid var(--border); background: var(--card); width: 36px; height: 36px; border-radius: 999px;
    cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
  }
  .theme-toggle:hover { background: var(--hover-bg); }
  .est-badge { font-size: 10.5px; font-weight: 600; color: var(--muted); background: var(--hover-bg); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; margin-left: 5px; vertical-align: middle; }

  .tabs { display: flex; gap: 6px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    border: none; background: none; color: var(--muted); font-size: 13.5px; font-weight: 600;
    padding: 10px 16px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  .range-selector { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .range-buttons { display: flex; gap: 4px; }
  .range-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--muted); font-size: 12px; font-weight: 600;
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
  }
  .range-btn:hover { border-color: var(--accent); color: var(--text); }
  .range-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .range-custom {
    display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--card);
    border-radius: 10px; padding: 6px 10px; font-size: 12.5px; color: var(--muted);
  }
  .range-custom input[type=date] {
    border: none; background: none; color: var(--text); font-size: 12.5px; font-family: inherit; padding: 2px;
  }

  .txn-filter-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 14px; padding: 10px 12px; background: var(--hover-bg); border: 1px solid var(--border); border-radius: 10px; }
  .txn-filter-bar input[type=text] { flex: 1 1 200px; min-width: 140px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 13px; padding: 7px 10px; border-radius: 8px; font-family: inherit; }
  .txn-filter-quick { display: flex; gap: 6px; }
  .txn-filter-quick select { border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 12.5px; padding: 6px 8px; border-radius: 8px; font-family: inherit; }
  .txn-filter-dates { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
  .txn-filter-dates input[type=date] { border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 12.5px; padding: 6px 8px; border-radius: 8px; font-family: inherit; }
  #txnFilterCount { color: var(--muted); font-size: 12px; white-space: nowrap; }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  /* Deckelt die Buchungen-Tabelle auf eine feste Hoehe (~ 20 Zeilen) - bei laengerer
     Historie scrollt man innerhalb der Tabelle statt die ganze Seite zu verlaengern.
     Kopfzeile bleibt beim Scrollen sichtbar. */
  .table-wrap-scroll { max-height: 640px; overflow-y: auto; border: 1px solid var(--row-border); border-radius: 8px; }
  .table-wrap-scroll table { margin: 0; }
  .table-wrap-scroll thead th { position: sticky; top: 0; background: var(--card); z-index: 1; box-shadow: 0 1px 0 var(--border); }

  /* Chart-Container reservieren von Anfang an ihre spaetere Plotly-Hoehe (Desktop-Werte).
     Sonst sind sie bis zum fertigen Plotly-Rendering 0px hoch und der Rest der Seite
     "springt" beim Auf-/Zuklappen kurz nach oben und wieder nach unten - genau der
     Effekt, den ein Tab-/Depot-Wechsel oder ein Zeitraum-Button ausloest. */
  #balanceChart { min-height: 300px; }
  #categoryChart { min-height: 200px; }
  #depositChart { min-height: 360px; }
  #areaChart { min-height: 380px; }
  #donutChart { min-height: 340px; }
  #regionChart, #sectorChart { min-height: 220px; }

  @media (max-width: 820px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .grid { grid-template-columns: 1fr; }
  }

  /* ============================================================
     Mobile (iPhone 14 Pro & aehnliche Breiten, ~390-430px)
     ============================================================ */
  @media (max-width: 480px) {
    body { padding: 14px 12px 48px; }
    header { flex-direction: column; align-items: stretch; gap: 10px; margin-bottom: 16px; }
    header h1 { font-size: 18px; }
    header p { font-size: 12.5px; }
    .header-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
    .header-actions .depot-select { grid-column: 1 / -1; text-align: center; padding: 10px 12px; }
    .header-actions #exportExcelBtn { grid-column: 1 / -1; }
    .theme-toggle { width: 100%; height: 40px; border-radius: 10px; }
    #fetchLiveHeaderBtn { font-size: 12px; padding: 10px 8px; white-space: normal; line-height: 1.25; }

    .dropzone { padding: 16px 12px; }
    .dropzone .main { font-size: 13px; }

    .tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; flex-wrap: nowrap; }
    .tab-btn { white-space: nowrap; padding: 10px 12px; font-size: 12.5px; }

    .hero-card { padding: 16px 14px 4px; border-radius: 16px; }
    .hero-label { font-size: 12px; }
    .hero-value { font-size: 28px; }
    .hero-badge { font-size: 12px; padding: 4px 10px; }
    .hero-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; margin: 14px 0 10px; }
    .hero-stat .hs-value { font-size: 14px; }

    .range-selector { flex-direction: column; align-items: stretch; gap: 10px; }
    .range-buttons { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
    .range-btn { flex: 0 0 auto; padding: 7px 11px; font-size: 11.5px; }
    .range-custom { justify-content: space-between; }
    .range-custom input[type=date] { width: 42%; min-width: 0; }
    .txn-filter-bar { flex-direction: column; align-items: stretch; }
    .txn-filter-bar input[type=text] { width: 100%; }
    .txn-filter-quick { justify-content: space-between; }
    .txn-filter-quick select { flex: 1 1 0; }
    .txn-filter-dates { justify-content: space-between; }
    .table-wrap-scroll { max-height: 460px; }
    .txn-filter-dates input[type=date] { width: 44%; }
    #txnFilterReset { width: 100%; }
    #txnFilterCount { text-align: center; }

    .card { padding: 14px 14px; border-radius: 14px; margin-bottom: 12px; }
    .card h2 { font-size: 13px; }

    table { font-size: 12px; }
    th, td { padding: 7px 6px; }
    td.mono { font-size: 10.5px; }

    .deposit-form { flex-direction: column; align-items: stretch; padding: 12px; }
    .deposit-form .field { width: 100%; }
    .deposit-form input, .deposit-form select { width: 100% !important; min-width: 0; }
    .deposit-form button { width: 100%; }

    .est-badge { display: inline-block; margin-top: 2px; }
    footer { font-size: 11px; padding: 0 8px; }

    /* iOS Safari zoomt automatisch in ein Eingabefeld/Dropdown hinein, sobald dessen
       Schriftgroesse unter 16px liegt. Genau dieser Zoom ist es, der beim Antippen eines
       Buttons/Dropdowns wie ein "Verschieben" des Bildschirms wirkt - und kann nebenbei
       sogar ein resize-Event ausloesen, das gerade eingetippte Werte in anderen Feldern
       zuruecksetzt. Fix: alle interaktiven Formularfelder auf mind. 16px auf Mobilgeraeten. */
    .deposit-form input, .deposit-form select, .depot-select,
    .txn-filter-bar input[type=text], .txn-filter-dates input[type=date],
    .range-custom input[type=date], .backup-fallback textarea { font-size: 16px; }

    /* Auf Mobilbreiten rendert Plotly die Charts kleiner - reservierte Hoehe entsprechend
       anpassen (siehe Begruendung weiter oben bei der Basis-Regel). */
    #balanceChart { min-height: 220px; }
    #categoryChart { min-height: 160px; }
    #depositChart { min-height: 260px; }
    #areaChart { min-height: 260px; }
    #donutChart { min-height: 260px; }
    #regionChart, #sectorChart { min-height: 190px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Mein Depot Dashboard</h1>
      <p id="headerSub">Läuft komplett lokal in deinem Browser – keine Cloud, kein Account nötig.</p>
    </div>
    <div class="header-actions">
      <select id="depotSelect" class="depot-select" title="Depot/Konto wählen">
        <option value="combined">📊 Gesamtübersicht</option>
        <optgroup label="Depots">
          <option value="ing">🏦 ING DiBa Depot</option>
          <option value="tr">📱 Trade Republic Depot</option>
        </optgroup>
        <optgroup label="Konten">
          <option value="acc_ing_giro">💳 ING DiBa Girokonto</option>
          <option value="acc_ing_extra">💰 ING DiBa Extra-Konto</option>
          <option value="acc_tr_giro">📱 Trade Republic Girokonto</option>
        </optgroup>
      </select>
      <button class="theme-toggle" id="themeToggle" title="Dark/Light Mode wechseln">🌙</button>
      <button class="btn" id="exportBtnHeader" title="Sichert alle deine Daten (beide Depots, Einzahlungen, Kurse, Konten) als JSON-Backup">⬇ Backup</button>
      <button class="btn" id="importBtnHeader" title="Laedt eine zuvor exportierte Backup-Datei">⬆ Backup</button>

  const INCOME_CATEGORIES = ["Gehalt", "Nebeneinkommen", "Erstattung", "Geschenk", "Sonstiges"];

  // Migriert Daten aus der Vor-Multi-Depot-Version (unpraefixierte Keys) nach "ing:",
  // damit bereits gespeicherte Nutzerdaten beim Update nicht verloren gehen.
  function migrateLegacyDataToIng() {
    const legacySnapKeys = storage.list("snapshot:").filter((k) => !k.includes(":snapshot:"));
    if (legacySnapKeys.length && storage.list("ing:snapshot:").length === 0) {
      for (const k of legacySnapKeys) {
        const res = storage.get(k);
        if (res) storage.set("ing:" + k, res.value);
      }
    }
    const legacyDeposits = storage.get("deposits");
    if (legacyDeposits && storage.get("ing:deposits") === null) storage.set("ing:deposits", legacyDeposits.value);
    const legacyPrices = storage.get("currentPrices");
    if (legacyPrices && storage.get("ing:currentPrices") === null) storage.set("ing:currentPrices", legacyPrices.value);
  }

  // ============================================================
  // Konten: Storage, Salden, Wiederkehrende Buchungen (Daueraufträge)
  // ============================================================
  function loadAccountTransactions(accountId) {
    const res = storage.get(accountId + ":transactions");
    if (!res) return [];
    try { return JSON.parse(res.value); } catch (e) { return []; }
  }
  function saveAccountTransactions(accountId, list) {
    storage.set(accountId + ":transactions", JSON.stringify(list.sort((a, b) => a.date.localeCompare(b.date))));
  }
  function loadRecurringRules(accountId) {
    const res = storage.get(accountId + ":recurring");
    if (!res) return [];
    try { return JSON.parse(res.value); } catch (e) { return []; }
  }
  function saveRecurringRules(accountId, list) { storage.set(accountId + ":recurring", JSON.stringify(list)); }

  function computeAccountBalance(accountId, atDateIso) {
    const cfg = ACCOUNTS[accountId];
    const txns = loadAccountTransactions(accountId);
    const relevant = atDateIso ? txns.filter((t) => t.date <= atDateIso) : txns;
    return cfg.startBalance + relevant.reduce((s, t) => s + t.amount, 0);
  }

  function isAccountId(key) { return Object.prototype.hasOwnProperty.call(ACCOUNTS, key); }

  // Fuegt Betrag amount (positiv=Einnahme, negativ=Ausgabe/Abgang) einer einzelnen
  // Buchung zu einem Konto hinzu.
  function addAccountTransaction(accountId, txn) {
    const list = loadAccountTransactions(accountId);
    list.push(txn);
    saveAccountTransactions(accountId, list);
  }

  // Loest eine ISIN zu ihrer Bezeichnung im jeweiligen Depot auf (fuer Notiztexte).
  function resolveDepotIsinName(depotKey, isin) {
    if (!isin) return null;
    const data = loadSingleDepotData(depotKey);
    const positions = (data.latestReal || data.latest || {}).positions || [];
    const pos = positions.find((p) => p.ISIN === isin);
    return pos ? pos.Bezeichnung : isin;
  }

  // Verarbeitet eine "Umbuchung" oder "Depot-Einzahlung": bucht auf dem Quellkonto ab
  // und je nach Ziel entweder auf dem Zielkonto zu, oder legt automatisch eine
  // Einzahlung im Zieldepot an (Integration mit der bestehenden Einzahlungs-Verwaltung).
  function processTransfer(sourceAccountId, amount, date, note, targetAccountId, targetDepot, targetIsin, recurringId) {
    const txnId = uid();
    // Zielbeschreibung (Depot + ggf. konkretes ETF) fuer die Buchungs-Notiz - damit in der
    // Kontohistorie immer sichtbar ist, WOHIN eine Einzahlung/ein Sparplan tatsaechlich floss,
    // nicht nur dass es "irgendeine" Depot-Einzahlung war.
    let targetDesc = null;
    if (targetDepot) {
      const etfName = targetIsin ? resolveDepotIsinName(targetDepot, targetIsin) : null;
      targetDesc = etfName ? `${DEPOTS[targetDepot].label}: ${etfName}` : `${DEPOTS[targetDepot].label} (gesamtes Portfolio)`;
    }
    const sourceNote = targetDepot
      ? (note ? `${note} – Einzahlung in ${targetDesc}` : `Einzahlung in ${targetDesc}`)
      : (note || `Umbuchung zu ${ACCOUNTS[targetAccountId].label}`);
    addAccountTransaction(sourceAccountId, {
      id: txnId, date, amount: -Math.abs(amount),
      type: targetDepot ? "invest_out" : "transfer_out",
      category: targetDepot ? "Depot-Einzahlung" : "Umbuchung",
      note: sourceNote,
      link: targetDepot ? { depot: targetDepot, isin: targetIsin || null } : { accountId: targetAccountId },
      recurringId: recurringId || undefined,
    });
    if (targetAccountId) {
      addAccountTransaction(targetAccountId, {
        id: uid(), date, amount: Math.abs(amount), type: "transfer_in", category: "Umbuchung",
        note: note || `Umbuchung von ${ACCOUNTS[sourceAccountId].label}`, link: { accountId: sourceAccountId },
        recurringId: recurringId || undefined,
      });
    }
    if (targetDepot) {
      const deposits = loadDeposits(targetDepot);
      deposits.push({
        id: "acc-" + txnId, date, amount: Math.abs(amount),
        note: note || `Von ${ACCOUNTS[sourceAccountId].label}`, isin: targetIsin || null,
      });
      saveDeposits(targetDepot, deposits);
    }
  }

  // Korrigiert einzelne (nicht doppelte) Dauerauftrags-Buchungen, deren Datum durch den
  // fruehreren Zeitzonen-Bug einen Kalendertag zu frueh gespeichert wurde (z.B. Regel auf
  // Tag 1 gestellt, aber am 30./31. abgebucht statt am 1.). Der alte Bug hat das Datum
  // IMMER konsequent genau einen Tag zu frueh formatiert (nie mehr, nie weniger) - daher
  // reicht ein gezielter "+1 Tag"-Fix, wenn genau dieses Muster erkannt wird. Korrigiert
  // auch das Datum der verknuepften Depot-Einzahlung, damit beide konsistent bleiben.
  function fixMisdatedRecurringTransactions(accountId) {
    const rules = loadRecurringRules(accountId);
    const ruleById = {};
    for (const r of rules) ruleById[r.id] = r;
    const txns = loadAccountTransactions(accountId);
    const correctedTxnIds = {}; // alte txnId -> neues Datum
    let touched = false;
    for (const t of txns) {
      if (!t.recurringId) continue;
      const rule = ruleById[t.recurringId];
      if (!rule) continue;
      const wantDay = Math.min(rule.dayOfMonth, 28);
      const d = parseIsoLocal(t.date);
      if (d.getDate() === wantDay) continue;
      const shifted = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
      if (shifted.getDate() === wantDay) {
        t.date = fmtIsoLocal(shifted);
        correctedTxnIds[t.id] = t.date;
        touched = true;
      }
    }
    if (!touched) return;
    saveAccountTransactions(accountId, txns);
    for (const depotKey of Object.keys(DEPOTS)) {
      const deposits = loadDeposits(depotKey);
      let depotTouched = false;
      for (const dep of deposits) {
        const txnId = dep.id.startsWith("acc-") ? dep.id.slice(4) : null;
        if (txnId && correctedTxnIds[txnId]) { dep.date = correctedTxnIds[txnId]; depotTouched = true; }
      }
      if (depotTouched) saveDeposits(depotKey, deposits);
    }
  }

  // Entfernt doppelte Dauerauftrags-Buchungen (gleiche Regel + gleiches Datum mehrfach
  // gebucht), die durch den fruehreren Zeitzonen-Bug in der Faelligkeitsberechnung
  // entstanden sein koennen, inkl. der zugehoerigen Depot-Einzahlungen. Selbstheilend -
  // laeuft bei jedem Render und findet nach der ersten Bereinigung normalerweise nichts
  // mehr, kostet also praktisch nichts.
  function dedupeRecurringTransactions(accountId) {
    const txns = loadAccountTransactions(accountId);
    const seenKeys = new Set();
    const keepTxns = [];
    const removedIds = [];
    for (const t of txns) {
      if (t.recurringId) {
        const key = t.recurringId + "|" + t.date;
        if (seenKeys.has(key)) { removedIds.push(t.id); continue; }
        seenKeys.add(key);
      }
      keepTxns.push(t);
    }
    if (!removedIds.length) return;
    saveAccountTransactions(accountId, keepTxns);
    // Zugehoerige Depot-Einzahlungen (bei "invest"-Daueraufträgen ueber processTransfer
    // angelegt, ID-Schema "acc-<txnId>") ebenfalls entfernen, sonst bleibt das eingezahlte
    // Kapital im Depot weiterhin verfaelscht.
    const removedDepositIds = new Set(removedIds.map((id) => "acc-" + id));
    for (const depotKey of Object.keys(DEPOTS)) {
      const deposits = loadDeposits(depotKey);
      const cleanedDeposits = deposits.filter((d) => !removedDepositIds.has(d.id));
      if (cleanedDeposits.length !== deposits.length) saveDeposits(depotKey, cleanedDeposits);
    }
  }

  // Stellt sicher, dass "lastProcessed" jeder Regel exakt zum juengsten tatsaechlich
  // vorhandenen Buchungsdatum passt - wichtig nach dem Bereinigen von Dubletten, damit
  // kuenftige Faelligkeiten korrekt weitergezaehlt werden statt erneut auszuloesen.
  function syncLastProcessed(accountId) {
    const txns = loadAccountTransactions(accountId);
    const maxDateByRule = {};
    for (const t of txns) {
      if (!t.recurringId) continue;
      if (!maxDateByRule[t.recurringId] || t.date > maxDateByRule[t.recurringId]) maxDateByRule[t.recurringId] = t.date;
    }
    const rules = loadRecurringRules(accountId);
    let changed = false;
    for (const rule of rules) {
      const maxDate = maxDateByRule[rule.id];
      if (maxDate && rule.lastProcessed !== maxDate) { rule.lastProcessed = maxDate; changed = true; }
    }
    if (changed) saveRecurringRules(accountId, rules);
  }

  // Erzeugt faellige Buchungen aus aktiven Daueraufträgen bis heute (einmalig pro
  // Faelligkeit, ueber "lastProcessed" nachverfolgt). Wird bei jedem Start/Render geprueft.
  // Unterstuetzt "expense"/"income" (einfache Kontobuchung) sowie "invest" (ETF-Sparplan:
  // belastet das Konto und legt automatisch eine Einzahlung im Zieldepot an).
  function processRecurringRules() {
    const todayIso = todayIsoLocal();
    for (const accountId of Object.keys(ACCOUNTS)) {
      fixMisdatedRecurringTransactions(accountId);
      dedupeRecurringTransactions(accountId);
      syncLastProcessed(accountId);
      const rules = loadRecurringRules(accountId);
      let changed = false;
      for (const rule of rules) {
        if (!rule.active) continue;
        // Wichtig: konsequent mit lokalen Datums-Helfern arbeiten (nicht new Date(isoString),
        // das als UTC interpretiert wird, gemischt mit new Date(y,m,d), das lokale Zeit ist -
        // dieser Mix fuehrte dazu, dass ein Dauerauftrag mit Faelligkeitstag = heutigem Tag
        // faelschlich erst einen Monat spaeter ausgefuehrt wurde).
        const cursor = rule.lastProcessed ? parseIsoLocal(rule.lastProcessed) : parseIsoLocal(rule.startDate || todayIso);
        // naechste Faelligkeit: gleicher Tag-im-Monat, nach dem zuletzt verarbeiteten Datum
        let next;
        if (!rule.lastProcessed) {
          // erste Faelligkeit: im Startmonat, falls Starttag schon erreicht (auch wenn er
          // heute ist), sonst naechster Monat
          next = new Date(cursor.getFullYear(), cursor.getMonth(), Math.min(rule.dayOfMonth, 28));
          if (fmtIsoLocal(next) < fmtIsoLocal(cursor)) next = new Date(cursor.getFullYear(), cursor.getMonth() + 1, Math.min(rule.dayOfMonth, 28));
        } else {
          next = new Date(cursor.getFullYear(), cursor.getMonth() + 1, Math.min(rule.dayOfMonth, 28));
        }
        let guard = 0;
        while (fmtIsoLocal(next) <= todayIso && guard < 240) {
          const dateIso = fmtIsoLocal(next);
          if (rule.type === "invest") {
            processTransfer(accountId, Math.abs(rule.amount), dateIso, rule.label + " (Dauerauftrag)", null, rule.targetDepot, rule.targetIsin, rule.id);
          } else {
            addAccountTransaction(accountId, {
              id: uid(), date: dateIso, amount: rule.amount, type: rule.amount < 0 ? "expense" : "income",
              category: rule.category, note: rule.label + " (Dauerauftrag)", recurringId: rule.id,
            });
          }
          rule.lastProcessed = dateIso;
          changed = true;
          next = new Date(next.getFullYear(), next.getMonth() + 1, Math.min(rule.dayOfMonth, 28));
          guard++;
        }
        // Kein Popup mehr bei Ausfuehrung - die Buchung ist bereits in der Historie sichtbar
        // (mit "(Dauerauftrag)"-Notiz bzw. Badge), das reicht als Nachweis.
      }
      if (changed) saveRecurringRules(accountId, rules);
    }
  }

  // ============================================================
  // Helpers
  // ============================================================
  function parseDeNumber(s) {
    if (s == null) return null;
    const clean = String(s).trim().replace(/\./g, "").replace(",", ".");
    const v = parseFloat(clean);
    return isNaN(v) ? null : v;
  }
  function fmtEur(value) {
    return value.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  }
  function fmtPct(value) {
    return (value >= 0 ? "+" : "") + value.toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " %";
  }

  // ============================================================
  // Excel-Gesamtexport: baut pro Jahr ein Arbeitsblatt im Stil eines klassischen
  // Haushaltsbuchs (Monate als Spalten, Einkommen/Fixe/Variable Ausgaben-Abschnitte,
  // Kontostand-Uebersicht unten) statt einer reinen Rohdaten-CSV.
  // ============================================================
  const FIXED_EXPENSE_CATEGORIES = ["Miete/Wohnen", "Versicherung", "Abo/Streaming"];
  const VARIABLE_EXPENSE_CATEGORIES = EXPENSE_CATEGORIES.filter((c) => !FIXED_EXPENSE_CATEGORIES.includes(c));
  const MONTH_NAMES = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
  const MONEY_FMT = '#,##0.00" €";-#,##0.00" €"';

  function depotValueAt(depotKey, atDateIso) {
    const snapshotsObj = loadSnapshots(depotKey);
    const isoDates = Object.keys(snapshotsObj).filter((d) => d <= atDateIso).sort();
    if (!isoDates.length) return 0;
    return snapshotsObj[isoDates[isoDates.length - 1]].positions.reduce((s, p) => s + p.Kurswert, 0);
  }

  function collectBudgetYears() {
    const years = new Set();
    for (const accId of Object.keys(ACCOUNTS)) {
      for (const t of loadAccountTransactions(accId)) years.add(t.date.slice(0, 4));
    }
    if (!years.size) years.add(todayIsoLocal().slice(0, 4));
    return Array.from(years).sort();
  }

  function aggregateYearData(year) {
    const income = {}; INCOME_CATEGORIES.forEach((c) => { income[c] = new Array(12).fill(0); });
    const fixed = {}; FIXED_EXPENSE_CATEGORIES.forEach((c) => { fixed[c] = new Array(12).fill(0); });
    const variable = {}; VARIABLE_EXPENSE_CATEGORIES.forEach((c) => { variable[c] = new Array(12).fill(0); });
    const depotInvest = new Array(12).fill(0);

    for (const accId of Object.keys(ACCOUNTS)) {
      for (const t of loadAccountTransactions(accId)) {
        if (t.date.slice(0, 4) !== year) continue;
        const m = parseInt(t.date.slice(5, 7), 10) - 1;
        if (t.type === "income") {
          const cat = INCOME_CATEGORIES.includes(t.category) ? t.category : "Sonstiges";
          income[cat][m] += t.amount;
        } else if (t.type === "expense") {
          const cat = EXPENSE_CATEGORIES.includes(t.category) ? t.category : "Sonstiges";
          const amt = Math.abs(t.amount);
          if (FIXED_EXPENSE_CATEGORIES.includes(cat)) fixed[cat][m] += amt; else variable[cat][m] += amt;
        } else if (t.type === "invest_out") {
          depotInvest[m] += Math.abs(t.amount);
        }
      }
    }
    return { income, fixed, variable, depotInvest };
  }

  function sumRow(row) { return row.reduce((a, b) => a + b, 0); }

  async function buildBudgetWorkbook() {
    const workbook = new ExcelJS.Workbook();
    workbook.creator = "Depot Dashboard";
    workbook.created = new Date();
    for (const year of collectBudgetYears()) addYearSheet(workbook, year);
    return workbook;
  }

  function addYearSheet(workbook, year) {
    const ws = workbook.addWorksheet(`Haushaltsbuch ${year}`, { views: [{ showGridLines: false }] });
    ws.columns = [{ width: 3 }, { width: 4 }, { width: 34 }, ...Array(12).fill({ width: 11 }), { width: 13 }];

    const data = aggregateYearData(year);
    const COLOR = { title: "2563EB", income: "008300", expense: "4A3AA7", surplusPos: "0CA30C", surplusNeg: "D03B3B", header: "1F2937" };
    let r = 1;

    ws.mergeCells(r, 2, r, 16);
    const titleCell = ws.getCell(r, 2);
    titleCell.value = "Dein Haushaltsbuch";
    titleCell.font = { name: "Calibri", size: 16, bold: true, color: { argb: "FFFFFFFF" } };
    titleCell.alignment = { vertical: "middle" };
    titleCell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF" + COLOR.title } };
    ws.getRow(r).height = 26;
    r += 2;

    ws.getCell(r, 2).value = `Haushaltsbuch ${year}`;
    ws.getCell(r, 2).font = { bold: true, size: 12 };
    for (let m = 0; m < 12; m++) {
      const cell = ws.getCell(r, 4 + m);
      cell.value = MONTH_NAMES[m];
      cell.alignment = { horizontal: "center" };
    }
    ws.getCell(r, 16).value = "Gesamt";
    ws.getCell(r, 16).alignment = { horizontal: "center" };
    for (let c = 2; c <= 16; c++) {
      const cell = ws.getCell(r, c);
      cell.font = { bold: true, color: { argb: "FFFFFFFF" } };
      cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF" + COLOR.header } };
    }
    r += 2;

    function sectionHeader(label, colorHex) {
      ws.mergeCells(r, 2, r, 16);
      const cell = ws.getCell(r, 2);
      cell.value = label;
      cell.font = { bold: true, size: 12, color: { argb: "FFFFFFFF" } };
      cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF" + colorHex } };
      r += 1;
    }
    function itemRow(label, monthValues) {
      ws.getCell(r, 3).value = label;
      let total = 0;
      for (let m = 0; m < 12; m++) {
        const v = monthValues[m];
        const cell = ws.getCell(r, 4 + m);
        cell.value = v; cell.numFmt = MONEY_FMT;
        total += v;
      }
      const totalCell = ws.getCell(r, 16);
      totalCell.value = total; totalCell.numFmt = MONEY_FMT;
      r += 1;
      return total;
    }
    function totalRow(label, monthTotals, grandTotal, colorHex) {
      ws.getCell(r, 3).value = label;
      ws.getCell(r, 3).font = { bold: true };
      for (let m = 0; m < 12; m++) {
        const cell = ws.getCell(r, 4 + m);
        cell.value = monthTotals[m]; cell.numFmt = MONEY_FMT; cell.font = { bold: true };
        cell.border = { top: { style: "thin", color: { argb: "FF" + colorHex } } };
      }
      const totalCell = ws.getCell(r, 16);
      totalCell.value = grandTotal; totalCell.numFmt = MONEY_FMT; totalCell.font = { bold: true };
      totalCell.border = { top: { style: "thin", color: { argb: "FF" + colorHex } } };
      r += 1;
    }

    sectionHeader("Einkommen", COLOR.income);
    const incomeRowTotals = new Array(12).fill(0);
    for (const cat of INCOME_CATEGORIES) {
      itemRow(cat, data.income[cat]);
      for (let m = 0; m < 12; m++) incomeRowTotals[m] += data.income[cat][m];
    }
    const incomeGrandTotal = sumRow(incomeRowTotals);
    totalRow("Gesamte Einnahmen", incomeRowTotals, incomeGrandTotal, COLOR.income);
    r += 1;

    sectionHeader("Fixe Ausgaben", COLOR.expense);
    const fixedRowTotals = new Array(12).fill(0);
    for (const cat of FIXED_EXPENSE_CATEGORIES) {
      itemRow(cat, data.fixed[cat]);
      for (let m = 0; m < 12; m++) fixedRowTotals[m] += data.fixed[cat][m];
    }
    itemRow("Depot-Einzahlungen (ETF-Sparpläne)", data.depotInvest);
    for (let m = 0; m < 12; m++) fixedRowTotals[m] += data.depotInvest[m];
    const fixedGrandTotal = sumRow(fixedRowTotals);
    totalRow("Gesamte fixe Ausgaben", fixedRowTotals, fixedGrandTotal, COLOR.expense);
    r += 1;

    sectionHeader("Variable Ausgaben", COLOR.expense);
    const variableRowTotals = new Array(12).fill(0);
    for (const cat of VARIABLE_EXPENSE_CATEGORIES) {
      itemRow(cat, data.variable[cat]);
      for (let m = 0; m < 12; m++) variableRowTotals[m] += data.variable[cat][m];
    }
    const variableGrandTotal = sumRow(variableRowTotals);
    totalRow("Gesamte variable Ausgaben", variableRowTotals, variableGrandTotal, COLOR.expense);
    r += 1;

    const expenseTotals = fixedRowTotals.map((v, m) => v + variableRowTotals[m]);
    const expenseGrandTotal = sumRow(expenseTotals);
    totalRow("Gesamte Ausgaben", expenseTotals, expenseGrandTotal, COLOR.header);
    r += 2;

    ws.getCell(r, 2).value = "Monatlicher Überschuss";
    ws.getCell(r, 2).font = { bold: true, size: 13 };
    ws.getRow(r).height = 22;
    const surplusTotals = incomeRowTotals.map((v, m) => v - expenseTotals[m]);
    for (let m = 0; m < 12; m++) {
      const cell = ws.getCell(r, 4 + m);
      cell.value = surplusTotals[m]; cell.numFmt = MONEY_FMT;
      cell.font = { bold: true, color: { argb: "FF" + (surplusTotals[m] >= 0 ? COLOR.surplusPos : COLOR.surplusNeg) } };
    }
    const surplusGrandTotal = incomeGrandTotal - expenseGrandTotal;
    const surplusTotalCell = ws.getCell(r, 16);
    surplusTotalCell.value = surplusGrandTotal; surplusTotalCell.numFmt = MONEY_FMT;
    surplusTotalCell.font = { bold: true, color: { argb: "FF" + (surplusGrandTotal >= 0 ? COLOR.surplusPos : COLOR.surplusNeg) } };
    r += 3;

    const isCurrentYear = year === todayIsoLocal().slice(0, 4);
    const atDate = isCurrentYear ? todayIsoLocal() : `${year}-12-31`;
    sectionHeader("Kontostand-Übersicht" + (isCurrentYear ? " (heute)" : ` (Stand ${isoToDisplay(atDate)})`), COLOR.header);
    const accBalances = [
      ["Girokonto", computeAccountBalance("acc_ing_giro", atDate)],
      ["Extra-Konto", computeAccountBalance("acc_ing_extra", atDate)],
      ["TR (Girokonto)", computeAccountBalance("acc_tr_giro", atDate)],
      ["ETF-Sparplan (ING Depot)", depotValueAt("ing", atDate)],
      ["TR (Depot)", depotValueAt("tr", atDate)],
    ];
    let grandBalance = 0;
    for (const [label, value] of accBalances) {
      ws.getCell(r, 3).value = label;
      const cell = ws.getCell(r, 4);
      cell.value = value; cell.numFmt = MONEY_FMT;
      grandBalance += value;
      r += 1;
    }
    ws.getCell(r, 3).value = "Gesamt";
    ws.getCell(r, 3).font = { bold: true };
    ws.getCell(r, 3).border = { top: { style: "thin" } };
    const grandCell = ws.getCell(r, 4);

  function arrayBufferToBase64(buffer) {
    const bytes = new Uint8Array(buffer);
    let binary = "";
    const chunkSize = 0x8000;
    for (let i = 0; i < bytes.length; i += chunkSize) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
    return btoa(binary);
  }

  function showBinaryDownloadFallback(buffer, filename, mimeType) {
    const box = document.getElementById("backupFallback");
    if (!box) return;
    const ios = isIOS();
    // Chrome/Edge blockieren aus Anti-Phishing-Gruenden zunehmend Downloads ueber
    // data:-Links (auch bei echtem Klick) - blob:-URLs sind davon nicht betroffen
    // und funktionieren am Desktop zuverlaessiger. Auf iOS bietet Safari beim langen
    // Druecken auf blob:-Links dagegen kein "Link herunterladen" an - dort bleibt es
    // bei data:, wo das funktioniert.
    const linkUrl = ios
      ? `data:${mimeType};base64,${arrayBufferToBase64(buffer)}`
      : URL.createObjectURL(new Blob([buffer], { type: mimeType }));
    box.innerHTML = `
      <div class="bf-title" style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
        <span>Datei bereit zum Speichern:</span>

      </div>
      <div class="bf-hint">${ios
        ? `Tippe <b>lange</b> auf den Link unten und wähle „Link herunterladen" bzw. „In Dateien sichern".`
        : `<b>Rechtsklick</b> auf den Link unten → „Link speichern unter…" (Chrome) bzw. „Verknüpfte Datei speichern unter…" (Edge). Ein normaler Linksklick öffnet die Datei teils nur, statt sie herunterzuladen.`}</div>
      <a class="btn" href="${linkUrl}" download="${filename}">⬇ ${filename}${ios ? " (lange drücken zum Speichern)" : ""}</a>
    `;
    box.style.display = "block";
    const closeBtn = document.getElementById("bfCloseBtn");
    if (closeBtn) closeBtn.addEventListener("click", () => { box.style.display = "none"; box.innerHTML = ""; });
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function deDateToISO(ddmmyyyy) {
    const [d, m, y] = ddmmyyyy.split(".");
    return `${y}-${m}-${d}`;
  }
  function isoToDisplay(iso) {
    const [y, m, d] = iso.split("-");
    return `${d}.${m}.${y}`;
  }
  // ---- Lokale (nicht UTC-verschobene) Datums-Helfer ----
  // Wichtig: new Date().toISOString() bzw. new Date("YYYY-MM-DD") arbeiten mit UTC. In
  // Deutschland (UTC+1/+2) kann das dazu fuehren, dass ein Datumsvergleich um wenige Stunden
  // "kippt" - z.B. bei Daueraufträgen, deren Faelligkeitstag auf den heutigen Tag faellt.
  // Diese Helfer rechnen konsequent mit dem lokalen Kalendertag, ohne UTC-Konvertierung.
  function todayIsoLocal() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  function parseIsoLocal(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  function fmtIsoLocal(dateObj) {
    return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, "0")}-${String(dateObj.getDate()).padStart(2, "0")}`;
  }
  // Berechnet eine synthetische "Heute"-Momentaufnahme: nimmt den letzten ECHTEN
  // (aus PDF importierten) Stichtag als Basis, addiert alle seither erfassten
  // Einzahlungen (proportional zur damaligen Depot-Aufteilung investiert, bewertet
  // zu den aktuellen Kursen) und bewertet die Bestandspositionen ebenfalls neu.
  function computeTodaySnapshot(realSnapshots, deposits, currentPrices) {
    if (!realSnapshots.length) return null;
    const base = realSnapshots[realSnapshots.length - 1];
    const baseTotal = base.positions.reduce((s, p) => s + p.Kurswert, 0);
    if (!baseTotal) return null;

    const hasAnyPrice = base.positions.some((p) => currentPrices[p.ISIN] != null);
    const laterDeposits = deposits.filter((d) => d.date > base.date);
    if (!hasAnyPrice && !laterDeposits.length) return null; // nichts zu aktualisieren

    const todayIso = todayIsoLocal();
    if (todayIso <= base.date) return null;

    const stueckByIsin = {};
    for (const p of base.positions) stueckByIsin[p.ISIN] = p.Stueck;

    for (const dep of laterDeposits) {
      if (dep.isin && stueckByIsin[dep.isin] != null) {
        // Gezielt in ein bestimmtes ETF investiert
        const p = base.positions.find((x) => x.ISIN === dep.isin);
        const price = currentPrices[dep.isin] || p.Kurswert / p.Stueck;
        if (price) stueckByIsin[dep.isin] += dep.amount / price;
      } else {
        // Kein Ziel-ETF angegeben: proportional zur damaligen Depot-Aufteilung
        for (const p of base.positions) {
          const weight = p.Kurswert / baseTotal;
          const amount = dep.amount * weight;
          const price = currentPrices[p.ISIN] || p.Kurswert / p.Stueck;
          if (price) stueckByIsin[p.ISIN] += amount / price;
        }
      }
    }

    const positions = base.positions.map((p) => {
      const price = currentPrices[p.ISIN] || p.Kurswert / p.Stueck;
      const stueck = stueckByIsin[p.ISIN];
      return { Bezeichnung: p.Bezeichnung, ISIN: p.ISIN, WKN: p.WKN, Stueck: stueck, Kurswert: stueck * price };
    });

    return {
      date: todayIso, dateDisplay: isoToDisplay(todayIso), positions,
      source: laterDeposits.length
        ? `aktualisiert mit aktuellen Kursen + ${laterDeposits.length} Einzahlung(en) seit ${isoToDisplay(base.date)}`
        : "aktualisiert mit aktuellen Kursen",
      synthetic: true,
    };
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  // Ruft den aktuellen Kurs eines Yahoo-Finance-Symbols ab. Yahoo blockiert direkte
  // Browser-Anfragen (CORS) - daher ueber einen oeffentlichen CORS-Proxy, mit Fallback
  // auf einen zweiten Proxy, falls der erste nicht erreichbar ist. Das ist ein
  // inoffizieller Weg (keine offizielle Yahoo-API) und kann gelegentlich fehlschlagen.
  const CORS_PROXIES = [
    (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    (u) => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
    (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  ];
  // Freie CORS-Proxys/Kursquellen sind oeffentliche Drittanbieter-Dienste ohne
  // Verfuegbarkeitsgarantie - ein haengender Request wuerde sonst die ganze
  // Aktualisierung lange blockieren. Timeout sorgt dafuer, dass zuegig zur
  // naechsten Quelle gewechselt wird, statt lange zu haengen.
  async function fetchWithTimeout(url, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      return await fetch(url, { signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  }
  async function fetchYahooPrice(symbol) {
    const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=1d`;
    let lastErr;
    for (const makeProxyUrl of CORS_PROXIES) {
      try {
        const res = await fetchWithTimeout(makeProxyUrl(yahooUrl), 6000);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const meta = data && data.chart && data.chart.result && data.chart.result[0] && data.chart.result[0].meta;
        if (meta && typeof meta.regularMarketPrice === "number") {
          return { price: meta.regularMarketPrice, currency: meta.currency, time: meta.regularMarketTime, source: "Yahoo Finance" };
        }
        throw new Error("Unerwartetes Antwortformat");
      } catch (e) {
        lastErr = e;
        continue;
      }
    }
    throw lastErr || new Error("Kein Proxy erreichbar");
  }

  // Parst die Stooq-CSV-Antwort: Symbol,Date,Time,Open,High,Low,Close,Volume
  function parseStooqCsv(text) {
    const lines = text.trim().split("\n");
    if (lines.length < 2) return null;
    const cols = lines[1].split(",");
    if (cols.length < 7) return null;
    const close = parseFloat(cols[6]);
    if (isNaN(close) || close <= 0 || cols[6] === "N/D") return null;
    return { price: close, currency: null, time: null, source: "Stooq" };
  }

  // Ruft den Kurs zuerst direkt von Stooq ab (oft ohne CORS-Einschraenkung, da einfache
  // oeffentliche Datenquelle), sonst ueber Proxy. Stooq liefert keine Waehrungsangabe -
  // bei .de-Symbolen (Xetra) gehen wir von EUR aus.
  async function fetchStooqPrice(symbol) {
    const stooqUrl = `https://stooq.com/q/l/?s=${symbol}&f=sd2t2ohlcv&h&e=csv`;
    try {
      const res = await fetchWithTimeout(stooqUrl, 5000);
      if (res.ok) {
        const parsed = parseStooqCsv(await res.text());
        if (parsed) return { ...parsed, currency: "EUR" };
      }
    } catch (e) { /* vermutlich CORS/Netzwerk - via Proxy erneut versuchen */ }
    for (const makeProxyUrl of CORS_PROXIES) {
      try {
        const res = await fetchWithTimeout(makeProxyUrl(stooqUrl), 6000);
        if (!res.ok) continue;
        const parsed = parseStooqCsv(await res.text());
        if (parsed) return { ...parsed, currency: "EUR" };
      } catch (e) { continue; }
    }
    return null;
  }

  // Holt den Kurs fuer eine ISIN: zuerst Stooq (primaer), dann Yahoo Finance (Fallback).
  // Rechnet einen Betrag von einer Fremdwaehrung in EUR um, ueber den Yahoo-FX-Kurs
  // (z.B. "CADEUR=X"). Gibt null zurueck, wenn die Waehrung nicht unterstuetzt wird
  // oder der Kurs nicht abgerufen werden konnte.
  async function convertToEur(amount, currency) {
    if (!currency || currency === "EUR") return { value: amount, fxRate: 1 };
    if (!CONVERTIBLE_CURRENCIES.includes(currency)) return null;
    try {
      const fx = await fetchYahooPrice(currency + "EUR=X");
      if (fx && typeof fx.price === "number") return { value: amount * fx.price, fxRate: fx.price };
    } catch (e) { /* Umrechnung fehlgeschlagen */ }
    return null;
  }

  async function fetchLivePrice(isin, stooqSymbols, yahooSymbols) {
    const stooqSymbol = stooqSymbols[isin];
    if (stooqSymbol) {
      const result = await fetchStooqPrice(stooqSymbol);
      if (result) return result;
    }
    const yahooSymbol = yahooSymbols[isin];
    if (yahooSymbol) {
      return await fetchYahooPrice(yahooSymbol);
    }
    throw new Error("kein Symbol hinterlegt");
  }

  // Plausibilitaetspruefung: verwirft Kurse, die unrealistisch stark vom letzten
  // bekannten Kurs abweichen (Schutzschutz vor fehlerhaften/verwechselten Antworten).
  function isPlausiblePrice(newPrice, lastKnownPrice) {
    if (!lastKnownPrice || lastKnownPrice <= 0) return true;
    const ratio = newPrice / lastKnownPrice;
    return ratio > 0.6 && ratio < 1.667; // max. +-40% Abweichung zulassen
  }

  // Ruft aktuelle Kurse fuer die ING-DiBa-ETFs ab und speichert sie. Beschraenkt sich
  // bewusst auf ING - die Live-Kurse fuer Trade Republic (Einzelaktien/Zertifikate an
  // Nebenboersen) waren zu unzuverlaessig, dort bitte weiterhin manuell eintragen.
  // Eigenstaendig (laedt Daten selbst), damit der Button unabhaengig vom aktiven
  // Tab/Depot aufgerufen werden kann - aktualisiert automatisch auch die Gesamtuebersicht,
  // da die kombinierte Ansicht bei jedem Render aus den ING-/TR-Rohdaten neu berechnet wird.
  async function runLivePriceFetch(button) {
    const depotsToRefresh = ["ing"];
    const origText = button ? button.textContent : null;
    if (button) { button.disabled = true; button.textContent = "Lade Kurse …"; }

    let successCount = 0, failCount = 0;
    for (const depotKey of depotsToRefresh) {
      const cfg = DEPOTS[depotKey];
      const snapshotsObj = loadSnapshots(depotKey);
      const isoDates = Object.keys(snapshotsObj).sort();
      if (!isoDates.length) continue;
      const latestReal = snapshotsObj[isoDates[isoDates.length - 1]];
      const currentPrices = loadCurrentPrices(depotKey);
      const prices = { ...currentPrices };
      const total = latestReal.positions.length;

      for (let posIdx = 0; posIdx < latestReal.positions.length; posIdx++) {
        const p = latestReal.positions[posIdx];
        if (button) button.textContent = `Lade Kurse … (${posIdx + 1}/${total})`;
        if (!cfg.stooqSymbols[p.ISIN] && !cfg.yahooSymbols[p.ISIN]) {
          logStatus(`⚠ [${cfg.label}] ${p.Bezeichnung}: kein Symbol hinterlegt, übersprungen.`, "warn");
          failCount++;
          continue;
        }
        try {
          let { price, currency, time, source } = await fetchLivePrice(p.ISIN, cfg.stooqSymbols, cfg.yahooSymbols);
          let fxNote = "";
          if (currency && currency !== "EUR") {
            const converted = await convertToEur(price, currency);
            if (!converted) {
              logStatus(`⚠ [${cfg.label}] ${p.Bezeichnung}: Kurs kam in ${currency}, Umrechnung in EUR fehlgeschlagen – nicht übernommen.`, "warn");
              failCount++;
              continue;
            }
            fxNote = ` (umgerechnet von ${price.toFixed(2)} ${currency} × ${converted.fxRate.toFixed(4)})`;
            price = converted.value;
          }
          const lastKnown = currentPrices[p.ISIN] || (p.Kurswert / p.Stueck);
          if (!isPlausiblePrice(price, lastKnown)) {
            logStatus(`⚠ [${cfg.label}] ${p.Bezeichnung}: ${source} lieferte ${price.toFixed(2)} €${fxNote} – weicht stark vom letzten Kurs (${lastKnown.toFixed(2)} €) ab, nicht übernommen.`, "warn");
            failCount++;
            continue;
          }
          prices[p.ISIN] = price;
          const timeStr = time ? new Date(time * 1000).toLocaleString("de-DE") : "";
          logStatus(`✓ [${cfg.label}] ${p.Bezeichnung} (${source}): ${price.toFixed(2)} €${fxNote} übernommen${timeStr ? " (Stand " + timeStr + ")" : ""}`, "success");
          successCount++;
        } catch (e) {
          logStatus(`✗ [${cfg.label}] ${p.Bezeichnung}: Live-Kurs konnte nicht abgerufen werden (${e.message || e}).`, "error");
          failCount++;
        }
      }
      if (successCount > 0) saveCurrentPrices(depotKey, prices);
    }
    if (successCount > 0) renderDashboard();
    if (button) { button.disabled = false; button.textContent = origText; }
    if (successCount === 0 && failCount > 0) {
      logStatus("Automatischer Kursabruf komplett fehlgeschlagen – bitte im Reiter 'Einzahlungen & Rohdaten' manuell eintragen.", "warn");
    } else if (failCount > 0) {
      logStatus(`ℹ ${successCount} von ${successCount + failCount} Kursen aktualisiert – Rest siehe Meldungen oben (freie Kursquellen sind gelegentlich nicht erreichbar, einfach nochmal versuchen).`, "warn");
    }
  }

  function isMobile() { return window.innerWidth < 480; }

  // Erkennt iOS (inkl. iPadOS, das sich als "MacIntel" mit Touch ausgibt) - dort
  // blockiert Safari den normalen Blob-Download zuverlaessig, am Desktop (Windows/
  // Mac/Linux-Browser) funktioniert er dagegen ganz normal. Die "lange druecken"/
  // Text-kopieren-Ausweichloesung soll deshalb nur auf iOS erscheinen.
  function isIOS() {
    return /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }

  // Validierte, CVD-sichere kategoriale Palette (fixe Reihenfolge, nicht rotieren) -
  // je ein Satz fuer hellen/dunklen Chart-Untergrund, damit die Kontrastwerte auch
  // im Dark Mode stimmen.
  const CATEGORICAL_LIGHT = ["#2a78d6", "#008300", "#e87ba4", "#eda100", "#1baf7a", "#eb6834", "#4a3aa7", "#e34948"];
  const CATEGORICAL_DARK = ["#3987e5", "#008300", "#d55181", "#c98500", "#199e70", "#d95926", "#9085e9", "#e66767"];

  function hexToRgba(hex, alpha) {
    const h = hex.replace("#", "");
    const r = parseInt(h.substring(0, 2), 16);
    const g = parseInt(h.substring(2, 4), 16);

    return {
