  // ============================================================
  // XIRR (interner Zinsfuss unter Beruecksichtigung der Zeitpunkte)
  // ============================================================
  function xirr(cashflows) {
    if (cashflows.length < 2) return null;
    const sorted = [...cashflows].sort((a, b) => a.date - b.date);
    const t0 = sorted[0].date;
    const msPerYear = 365.25 * 24 * 3600 * 1000;
    const years = sorted.map((cf) => (cf.date - t0) / msPerYear);
    const amounts = sorted.map((cf) => cf.amount);
    if (years[years.length - 1] <= 0) return null;

    function npv(rate) {
      let sum = 0;
      for (let i = 0; i < amounts.length; i++) sum += amounts[i] / Math.pow(1 + rate, years[i]);
      return sum;
    }
    function dnpv(rate) {
      let sum = 0;
      for (let i = 0; i < amounts.length; i++) {
        if (years[i] === 0) continue;
        sum += (-years[i] * amounts[i]) / Math.pow(1 + rate, years[i] + 1);
      }
      return sum;
    }

    let rate = 0.1;
    let converged = false;
    for (let i = 0; i < 200; i++) {
      const f = npv(rate);
      const df = dnpv(rate);
      if (Math.abs(df) < 1e-12) break;
      let newRate = rate - f / df;
      if (newRate <= -0.999999) newRate = -0.999999 + 1e-6;
      if (Math.abs(newRate - rate) < 1e-9) { rate = newRate; converged = true; break; }
      rate = newRate;
    }
    if (converged && isFinite(rate) && Math.abs(npv(rate)) < 1) return rate;

    // Fallback: Bisektion
    let lo = -0.9999, hi = 10;
    let flo = npv(lo), fhi = npv(hi);
    if (flo * fhi > 0) {
      hi = 100;
      fhi = npv(hi);
      if (flo * fhi > 0) return null;
    }
    for (let i = 0; i < 200; i++) {
      const mid = (lo + hi) / 2;
      const fmid = npv(mid);
      if (Math.abs(fmid) < 1e-6) return mid;
      if (flo < 0 === fmid < 0) { lo = mid; flo = fmid; } else { hi = mid; }
    }
    return (lo + hi) / 2;
  }

  function computeXirrPct(deposits, currentValue, currentDateIso) {
    if (!deposits.length) return null;
    const cashflows = deposits.map((d) => ({ date: new Date(d.date), amount: -Math.abs(d.amount) }));
    cashflows.push({ date: new Date(currentDateIso), amount: currentValue });
    const r = xirr(cashflows);
    return r == null ? null : r * 100;
  }

  // Schaetzt Ein-/Auszahlungen automatisch aus den Stueckzahl-Aenderungen zwischen
  // aufeinanderfolgenden Stichtagen (Naeherung: Kauf-/Verkaufspreis = Kurs am jeweiligen
  // Stichtag). Ersetzt keine echten Transaktionsdaten, dient aber als automatische
  // Rendite-Schaetzung, wenn keine Einzahlungen manuell erfasst wurden.
  function estimateCashflowsFromSnapshots(snapshots) {
    const cashflows = [];
    for (let i = 1; i < snapshots.length; i++) {
      const prev = snapshots[i - 1], curr = snapshots[i];
      const prevByIsin = {}; for (const p of prev.positions) prevByIsin[p.ISIN] = p;
      const currByIsin = {}; for (const p of curr.positions) currByIsin[p.ISIN] = p;
      const allIsins = new Set([...Object.keys(prevByIsin), ...Object.keys(currByIsin)]);
      let periodFlow = 0;
      for (const isin of allIsins) {
        const pPrev = prevByIsin[isin], pCurr = currByIsin[isin];
        const sPrev = pPrev ? pPrev.Stueck : 0;
        const sCurr = pCurr ? pCurr.Stueck : 0;
        const delta = sCurr - sPrev;
        if (Math.abs(delta) < 1e-9) continue;
        if (delta > 0) {
          const price = pCurr.Stueck ? pCurr.Kurswert / pCurr.Stueck : null;
          if (price != null) periodFlow += -(delta * price); // Investition = negativer Cashflow
        } else {
          const refPos = pPrev || pCurr;
          const price = refPos.Stueck ? refPos.Kurswert / refPos.Stueck : null;
          if (price != null) periodFlow += -delta * price; // Verkauf = positiver Cashflow
        }
      }
      if (Math.abs(periodFlow) > 0.01) cashflows.push({ date: curr.date, amount: periodFlow });
    }
    return cashflows;
  }

  function computeEstimatedXirrPct(snapshots, currentValue, currentDateIso) {
    if (snapshots.length < 2) return null;
    const cashflows = estimateCashflowsFromSnapshots(snapshots).map((c) => ({ date: new Date(c.date), amount: c.amount }));
    if (!cashflows.length) return null;
    cashflows.push({ date: new Date(currentDateIso), amount: currentValue });
    const r = xirr(cashflows);
    return r == null ? null : r * 100;
  }

  // Rendite p.a. (IRR) an JEDEM Stichtag entlang der Zeitachse – nutzt echte Einzahlungen,
  // falls vorhanden, sonst die automatisch geschaetzten Cashflows aus den Stueckzahl-Aenderungen.
  // Berechnet die gemischte Regionen- bzw. Branchengewichtung des Gesamtportfolios,
  // indem die Positions-Gewichtung mit der Index-Zusammensetzung des jeweiligen ETF
  // gewichtet und aufsummiert wird.
  function computeBlendedBreakdown(positions, weightsByIsin) {
    const total = positions.reduce((s, p) => s + p.Kurswert, 0);
    if (!total) return [];
    const blended = {};
    let unmapped = 0;
    for (const p of positions) {
      const posWeight = p.Kurswert / total;
      const refWeights = weightsByIsin[p.ISIN];
      if (!refWeights) { unmapped += posWeight; continue; }
      for (const [key, pct] of Object.entries(refWeights)) {
        blended[key] = (blended[key] || 0) + posWeight * (pct / 100);
      }
    }
    if (unmapped > 0.0001) blended["Unbekannt / nicht zugeordnet"] = (blended["Unbekannt / nicht zugeordnet"] || 0) + unmapped;
    return Object.entries(blended)
      .map(([label, frac]) => ({ label, pct: frac * 100 }))
      .sort((a, b) => b.pct - a.pct);
  }

  function renditeTrajectory(snapshots, deposits) {
    const useManual = deposits.length > 0;
    let baseCashflows;
    if (useManual) {
      baseCashflows = deposits.map((d) => ({ date: d.date, amount: -Math.abs(d.amount) }));
    } else {
      baseCashflows = estimateCashflowsFromSnapshots(snapshots).map((c) => ({ date: c.date, amount: c.amount }));
      // Startwert des ersten Stichtags als angenommene Ersteinlage behandeln (sonst kein Cashflow vor Punkt 1)
      if (snapshots.length) {
        const firstValue = snapshots[0].positions.reduce((s, p) => s + p.Kurswert, 0);
        if (firstValue > 0) baseCashflows.unshift({ date: snapshots[0].date, amount: -firstValue });
      }
    }
    baseCashflows.sort((a, b) => a.date.localeCompare(b.date));

    return snapshots.map((snap) => {
      const value = snap.positions.reduce((s, p) => s + p.Kurswert, 0);
      const relevant = baseCashflows.filter((c) => c.date <= snap.date);
      if (!relevant.length) return { date: snap.date, pct: null };
      const cfs = relevant.map((c) => ({ date: new Date(c.date), amount: c.amount }));
      cfs.push({ date: new Date(snap.date), amount: value });
      const r = xirr(cfs);
      return { date: snap.date, pct: r == null ? null : r * 100 };
    });
  }

  // ============================================================
  // PDF-Textextraktion (Zeilen-Rekonstruktion aus Textfragmenten)
  // ============================================================
  async function extractTextFromPDF(uint8data) {
    const pdf = await pdfjsLib.getDocument({ data: uint8data }).promise;
    let fullText = "";
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      const items = content.items
        .map((it) => ({ str: it.str, x: it.transform[4], y: it.transform[5], w: it.width, h: Math.abs(it.transform[3]) || 10 }))
        .filter((it) => it.str.length > 0);
      items.sort((a, b) => b.y - a.y || a.x - b.x);
      const lines = [];
      let currentLine = [];
      let lastY = null;
      for (const it of items) {
        if (lastY === null || Math.abs(it.y - lastY) > it.h * 0.5) {
          if (currentLine.length) lines.push(currentLine);
          currentLine = [it];
          lastY = it.y;
        } else {
          currentLine.push(it);
        }
      }
      if (currentLine.length) lines.push(currentLine);
      for (const line of lines) {
        line.sort((a, b) => a.x - b.x);
        let lineText = "";
        let lastEndX = null;
        for (const it of line) {
          if (lastEndX !== null && it.x - lastEndX > it.h * 0.28) lineText += " ";
          lineText += it.str;
          lastEndX = it.x + it.w;
        }
        fullText += lineText + "\n";
      }
    }
    return fullText;
  }

  // ============================================================
  // Positions-/Datumsparser (getestet gegen echte ING-Depotauszuege)
  // ============================================================
  const POSITION_LINE_RE = /^\s*([\d.,]+)\s+Stück\s+(.+?)\s+([\d.,]+)\s+EUR\s+([\d.,]+)\s+EUR\s*$/gm;
  const ISIN_WKN_RE = /ISIN\s*\(WKN\)\s*:\s*([A-Z]{2}[A-Z0-9]{9}\d)\s*\(([^)]+)\)/g;
  const ISIN_ONLY_RE = /\b[A-Z]{2}[A-Z0-9]{9}\d\b/;
  const NUMBER_RE = /-?\d{1,3}(?:\.\d{3})*(?:,\d+)?/g;
  const DEPOTAUSZUG_DATE_RE = /Depotauszug per\s*(\d{2})\.(\d{2})\.(\d{4})/;
  const JAHRESDEPOT_DATE_RE = /zum\s*(\d{2})\.(\d{2})\.(\d{4})\s*abgeschlossene/;
  const LETTER_DATE_RE = /Datum:\s*(\d{2})\.(\d{2})\.(\d{4})/;
  const GESAMTKURSWERT_RE = /Gesamtkurswert\s+([\d.,]+)\s*EUR/;

  function parsePositionsIngFormat(text) {
    const headers = [...text.matchAll(POSITION_LINE_RE)];
    const isins = [...text.matchAll(ISIN_WKN_RE)];
    if (!headers.length || headers.length !== isins.length) return [];
    return headers.map((h, i) => ({
      Bezeichnung: h[2].trim(), ISIN: isins[i][1], WKN: isins[i][2],
      Stueck: parseDeNumber(h[1]), Kurswert: parseDeNumber(h[4]),
    }));
  }
  function parsePositionsFallback(text) {
    const rows = [];
    for (const line of text.split("\n")) {
      const isinMatch = ISIN_ONLY_RE.exec(line);
      ISIN_ONLY_RE.lastIndex = 0;
      if (!isinMatch) continue;
      const withoutIsin = line.slice(0, isinMatch.index) + " " + line.slice(isinMatch.index + isinMatch[0].length);
      const numbers = [...withoutIsin.matchAll(NUMBER_RE)].map((m) => parseDeNumber(m[0])).filter((v) => v != null);
      if (numbers.length < 2) continue;
      const name = line.slice(0, isinMatch.index).trim().replace(/^[-|\s]+/, "");
      const kurswert = numbers.reduce((a, b) => (Math.abs(b) > Math.abs(a) ? b : a));
      rows.push({ Bezeichnung: name || "Unbekannt", ISIN: isinMatch[0], WKN: "", Stueck: numbers[0], Kurswert: kurswert });
    }
    const byIsin = {};
    for (const r of rows) if (!byIsin[r.ISIN] || Math.abs(r.Kurswert) > Math.abs(byIsin[r.ISIN].Kurswert)) byIsin[r.ISIN] = r;
    return Object.values(byIsin);
  }
  function guessDate(text) {
    let m = DEPOTAUSZUG_DATE_RE.exec(text);
    if (m) return `${m[1]}.${m[2]}.${m[3]}`;
    m = JAHRESDEPOT_DATE_RE.exec(text);
    if (m) return `${m[1]}.${m[2]}.${m[3]}`;
    m = LETTER_DATE_RE.exec(text);
    if (m) return `${m[1]}.${m[2]}.${m[3]}`;
    return null;
  }

  // ============================================================
  // UI: Log
  // ============================================================
  const logEl = document.getElementById("log");
  let logClearTimer = null;
  function logStatus(msg, level) {
    const div = document.createElement("div");
    div.className = "log-entry " + (level || "info");
    div.textContent = msg;
    logEl.prepend(div);
    while (logEl.children.length > 4) logEl.removeChild(logEl.lastChild);
    if (logClearTimer) clearTimeout(logClearTimer);
    logClearTimer = setTimeout(() => {
      logEl.innerHTML = "";
      logClearTimer = null;
    }, 20000);
  }

  // ============================================================
  // Backup Export/Import (Nutzerdaten, umfasst Depots UND Konten). Top-Level-Funktionen,
  // damit sie von den statischen Header-Buttons (ueberleben Re-Renders) genutzt werden
  // koennen, unabhaengig davon welches Depot/welcher Tab gerade aktiv ist.
  // ============================================================
  function runBackupExport() {
    let json, filename;
    try {
      const backup = {
        ing: { snapshots: loadSnapshots("ing"), deposits: loadDeposits("ing"), currentPrices: loadCurrentPrices("ing") },
        tr: { snapshots: loadSnapshots("tr"), deposits: loadDeposits("tr"), currentPrices: loadCurrentPrices("tr") },
        accounts: {},
        exportedAt: new Date().toISOString(),
      };
      for (const accId of Object.keys(ACCOUNTS)) {
        backup.accounts[accId] = { transactions: loadAccountTransactions(accId), recurring: loadRecurringRules(accId) };
      }
      json = JSON.stringify(backup, null, 2);
      filename = `depot-backup-${new Date().toISOString().slice(0, 10)}.json`;
    } catch (err) {
      logStatus(`✗ Backup konnte nicht erstellt werden: ${err.message || err}`, "error");
      return;
    }

    // Immer SOFORT und synchron einen klickbaren Download-Link anzeigen, bevor irgendetwas
    // Asynchrones versucht wird - ein synthetischer a.click()-Download kann in manchen
    // Hosting-/Sandbox-Umgebungen lautlos fehlschlagen (auch am Desktop), waehrend ein
    // echter Klick auf einen sichtbaren Link zuverlaessig funktioniert. Der Hinweistext
    // in showBackupFallback() passt sich automatisch an iOS vs. Desktop an.
    showBackupFallback(json, filename);

    // Zusaetzlich versuchen: klassischer Blob-Download (funktioniert in normalen Browsern).
    try {
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    } catch (err) { /* ignorieren, Fallback-Bereich ist bereits sichtbar */ }

    // Zusaetzlich versuchen: native Teilen-Funktion, mit Timeout abgesichert, falls die
    // Promise in manchen In-App-Browsern nie aufgeloest wird (haengen bleibt).
    try {
      if (navigator.canShare && navigator.share) {
        const file = new File([json], filename, { type: "application/json" });
        if (navigator.canShare({ files: [file] })) {
          const sharePromise = navigator.share({ files: [file], title: "Depot-Backup" });
          Promise.race([
            sharePromise,
            new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 2500)),
          ])
            .then(() => logStatus("✓ Teilen-Dialog geöffnet.", "success"))
            .catch(() => { /* stumm ignorieren, z.B. AbortError oder Timeout */ });
        }
      }
    } catch (err) { /* ignorieren */ }
  }

  // Laedt eine eigenstaendige Kopie des Tool-Programmcodes selbst herunter (nicht die
  // Nutzerdaten) - nutzt denselben Mehrfach-Fallback wie der Daten-Backup-Export, da
  // ein reiner Blob-Download in eingebetteten/mobilen Browsern oft lautlos fehlschlaegt.
  // Wichtig: ORIGINAL_HTML kann mehrere MB gross sein (eingebettete Bibliotheken) -
  // dafuer den schnellen TextEncoder/Byte-Weg nutzen (wie beim Excel-Export), NICHT
  // den fuer kleine JSON-Backups gedachten btoa(unescape(encodeURIComponent(...)))-Weg
  // aus showBackupFallback(), der bei mehreren MB Text die Seite spuerbar einfriert.
  function runToolHtmlDownload() {
    const filename = "depot_tool_standalone.html";
    const buffer = new TextEncoder().encode(ORIGINAL_HTML).buffer;
    showBinaryDownloadFallback(buffer, filename, "text/html");
    try {
      const blob = new Blob([buffer], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    } catch (err) { /* ignorieren, Fallback-Bereich ist bereits sichtbar */ }
    try {
      if (navigator.canShare && navigator.share) {
        const file = new File([buffer], filename, { type: "text/html" });
        if (navigator.canShare({ files: [file] })) {
          const sharePromise = navigator.share({ files: [file], title: "Depot Tool" });
          Promise.race([
            sharePromise,
            new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 2500)),
          ])
            .then(() => logStatus("✓ Teilen-Dialog geöffnet.", "success"))
            .catch(() => { /* stumm ignorieren */ });
        }
      }
    } catch (err) { /* ignorieren */ }
  }

  function showBackupFallback(json, filename, mimeType) {
    const box = document.getElementById("backupFallback");
    if (!box) return;
    mimeType = mimeType || "application/json";
    const ios = isIOS();
    // Siehe Kommentar in showBinaryDownloadFallback(): data: fuer iOS (langes Druecken),
    // blob: fuer Desktop (data:-Downloads werden dort von Chrome/Edge zunehmend blockiert).
    const linkUrl = ios
      ? `data:${mimeType};charset=utf-8;base64,${btoa(unescape(encodeURIComponent(json)))}`
      : URL.createObjectURL(new Blob([json], { type: mimeType }));
    box.innerHTML = `
      <div class="bf-title" style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
        <span>Datei bereit zum Speichern:</span>
        <button class="btn" id="bfCloseBtn" type="button" title="Schließen" style="flex:none; padding:4px 10px;">✕</button>
      </div>
      <div class="bf-hint">
        ${ios
          ? `Tippe <b>lange</b> auf den Link unten und wähle „Link herunterladen" bzw. „In Dateien sichern" –
             das funktioniert meist auch in eingebetteten Browsern (z. B. in der App „Documents"), wenn der normale
             Download nicht startet. Alternativ: Text unten kopieren und in einer neuen Datei (z. B. in der
             Dateien-App) als <span class="mono">${filename}</span> speichern.`
          : `<b>Rechtsklick</b> auf den Link unten → „Link speichern unter…" (Chrome) bzw. „Verknüpfte Datei
             speichern unter…" (Edge), um <span class="mono">${filename}</span> herunterzuladen. Ein normaler
             Linksklick öffnet die Datei teils nur, statt sie herunterzuladen.`}
      </div>
      <a class="btn" href="${linkUrl}" download="${filename}">⬇ ${filename}${ios ? " (lange drücken zum Speichern)" : ""}</a>
      <div class="bf-actions">
        <button class="btn" id="bfCopyBtn" type="button">📋 Text kopieren</button>
      </div>
      <textarea id="bfTextarea" readonly onclick="this.select()">${json.replace(/</g, "&lt;")}</textarea>
    `;
    box.style.display = "block";
    const closeBtn = document.getElementById("bfCloseBtn");
    if (closeBtn) {
      closeBtn.addEventListener("click", () => {
        box.style.display = "none";
        box.innerHTML = "";
      });
    }
    const copyBtn = document.getElementById("bfCopyBtn");
    const textarea = document.getElementById("bfTextarea");
    if (copyBtn) {
      copyBtn.addEventListener("click", async () => {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(json);
          } else {
            textarea.select();
            document.execCommand("copy");
          }
          logStatus("✓ Backup-Text in die Zwischenablage kopiert.", "success");
        } catch (err) {
          textarea.select();
          logStatus("Kopieren fehlgeschlagen – Text ist markiert, bitte manuell kopieren.", "warn");
        }
      });
    }
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  // Erlaubt den Backup-Import auch aus .txt/.pdf/.docx (nicht nur .json) - hilfreich,
  // wenn der Backup-Text z.B. ueber die Notizen-App als PDF/Datei zwischengespeichert wurde.
  function normalizeImportedText(s) {
    return s
      .replace(/[“”„‟]/g, '"')
      .replace(/[‘’‚‛]/g, "'")
      .replace(/[–—]/g, "-")
      .replace(/ /g, " ");
  }

  function extractJsonSubstring(text) {
    const start = text.indexOf("{");
    const end = text.lastIndexOf("}");
    if (start === -1 || end === -1 || end < start) return text;
    return text.slice(start, end + 1);
  }

  async function extractPdfText(file) {
    const buf = await file.arrayBuffer();
    const doc = await pdfjsLib.getDocument({ data: buf }).promise;
    let out = "";
    for (let i = 1; i <= doc.numPages; i++) {
      const page = await doc.getPage(i);
      const content = await page.getTextContent();
      out += content.items.map((it) => it.str).join(" ") + "\n";
    }
    return out;
  }

  async function extractDocxText(file) {
    const buf = await file.arrayBuffer();
    const view = new DataView(buf);
    const bytes = new Uint8Array(buf);

    let eocdOffset = -1;
    const searchStart = Math.max(0, bytes.length - 22 - 65557);
    for (let i = bytes.length - 22; i >= searchStart; i--) {
      if (view.getUint32(i, true) === 0x06054b50) { eocdOffset = i; break; }
    }
    if (eocdOffset === -1) throw new Error("Kein gültiges .docx-Format erkannt (fehlende ZIP-Struktur).");

    const entryCount = view.getUint16(eocdOffset + 10, true);
    let cdOffset = view.getUint32(eocdOffset + 16, true);
    const decoder = new TextDecoder("utf-8");
    let docXmlBytes = null;

    for (let i = 0; i < entryCount; i++) {
      if (view.getUint32(cdOffset, true) !== 0x02014b50) break;
      const compMethod = view.getUint16(cdOffset + 10, true);
      const compSize = view.getUint32(cdOffset + 20, true);
      const nameLen = view.getUint16(cdOffset + 28, true);
      const extraLen = view.getUint16(cdOffset + 30, true);
      const commentLen = view.getUint16(cdOffset + 32, true);
      const localHeaderOffset = view.getUint32(cdOffset + 42, true);
      const name = decoder.decode(bytes.subarray(cdOffset + 46, cdOffset + 46 + nameLen));

      if (name === "word/document.xml") {
        const lhNameLen = view.getUint16(localHeaderOffset + 26, true);
        const lhExtraLen = view.getUint16(localHeaderOffset + 28, true);
        const dataStart = localHeaderOffset + 30 + lhNameLen + lhExtraLen;
        const compData = bytes.slice(dataStart, dataStart + compSize);
        if (compMethod === 0) {
          docXmlBytes = compData;
        } else if (compMethod === 8) {
          const stream = new Blob([compData]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
          docXmlBytes = new Uint8Array(await new Response(stream).arrayBuffer());
        } else {
          throw new Error("Nicht unterstützte Komprimierung in der Word-Datei.");
        }
        break;
      }
      cdOffset += 46 + nameLen + extraLen + commentLen;
    }

    if (!docXmlBytes) throw new Error("word/document.xml nicht gefunden – ist das eine echte .docx-Datei?");
    const xml = decoder.decode(docXmlBytes);
    const withBreaks = xml.replace(/<\/w:p>/g, "\n");
    const stripped = withBreaks.replace(/<[^>]+>/g, "");
    const ta = document.createElement("textarea");
    ta.innerHTML = stripped;
    return ta.value;
  }

  async function readBackupFile(file) {
    const name = (file.name || "").toLowerCase();
    let raw;
    if (name.endsWith(".pdf")) {
      raw = await extractPdfText(file);
    } else if (name.endsWith(".docx")) {
      raw = await extractDocxText(file);
    } else {
      raw = await file.text();
    }
    return extractJsonSubstring(normalizeImportedText(raw));
  }

  async function runBackupImport(file) {
    if (!file) return;
    try {
      const text = await readBackupFile(file);
      let backup;
      try {
        backup = JSON.parse(text);
      } catch (parseErr) {
        throw new Error("Kein gültiges Backup-JSON in der Datei gefunden (evtl. durch Autokorrektur verändert).");
      }
      // Neues Format: { ing: {...}, tr: {...} }. Altes Einzeldepot-Format (vor Multi-Depot) wird als "ing" interpretiert.
      const depotsInBackup = (backup.ing || backup.tr) ? backup : { ing: backup };
      let totalSnaps = 0, totalDeps = 0;
      for (const depotKey of ["ing", "tr"]) {
        const d = depotsInBackup[depotKey];
        if (!d) continue;
        if (d.snapshots) for (const iso in d.snapshots) { saveSnapshot(depotKey, d.snapshots[iso]); totalSnaps++; }
        if (d.deposits) {
          const existing = loadDeposits(depotKey);
          const existingIds = new Set(existing.map((x) => x.id));
          const merged = existing.concat(d.deposits.filter((x) => !existingIds.has(x.id)));
          saveDeposits(depotKey, merged);
          totalDeps += d.deposits.length;
        }
        if (d.currentPrices) saveCurrentPrices(depotKey, { ...loadCurrentPrices(depotKey), ...d.currentPrices });
      }
      let totalTxns = 0;
      if (backup.accounts) {
        for (const accId of Object.keys(ACCOUNTS)) {
          const a = backup.accounts[accId];
          if (!a) continue;
          if (a.transactions) {
            const existing = loadAccountTransactions(accId);
            const existingIds = new Set(existing.map((x) => x.id));
            const merged = existing.concat(a.transactions.filter((x) => !existingIds.has(x.id)));
            saveAccountTransactions(accId, merged);
            totalTxns += a.transactions.length;
          }
          if (a.recurring) {
            const existingR = loadRecurringRules(accId);
            const existingRIds = new Set(existingR.map((x) => x.id));
            saveRecurringRules(accId, existingR.concat(a.recurring.filter((x) => !existingRIds.has(x.id))));
          }
        }
      }
      logStatus(`✓ Backup importiert (${totalSnaps} Stichtage, ${totalDeps} Einzahlungen, ${totalTxns} Kontobuchungen).`, "success");
      renderDashboard();
    } catch (err) {
      logStatus(`✗ Backup konnte nicht importiert werden: ${err.message || err}`, "error");
    }
  }

  // ============================================================
  // Datei-Verarbeitung
  // ============================================================
  async function processFile(file) {
    if (!file.name.toLowerCase().endsWith(".pdf") && file.type !== "application/pdf") {
      logStatus(`✗ ${file.name}: keine PDF-Datei, übersprungen.`, "error");
      return;
    }
    logStatus(`Lese ${file.name} …`, "info");
    try {
      const buf = await file.arrayBuffer();
      const text = await extractTextFromPDF(new Uint8Array(buf));
      let rows = parsePositionsIngFormat(text);
      if (!rows.length) rows = parsePositionsFallback(text);
      if (!rows.length) {
        logStatus(`⚠ ${file.name}: keine Positionen erkannt. Format evtl. abweichend.`, "warn");
        return;
      }
      const dateStr = guessDate(text);
      const isoDate = dateStr ? deDateToISO(dateStr) : new Date(file.lastModified).toISOString().slice(0, 10);
      const totalErkannt = rows.reduce((s, r) => s + r.Kurswert, 0);
      const gm = GESAMTKURSWERT_RE.exec(text);
      let matchNote = "", level = "success";
      if (gm) {
        const gesamtPdf = parseDeNumber(gm[1]);
        const diff = Math.abs(gesamtPdf - totalErkannt);
        if (diff < 0.01) matchNote = " · Summe stimmt überein ✓";
        else { matchNote = ` · ⚠ Abweichung: erkannt ${totalErkannt.toFixed(2)} € vs. PDF ${gesamtPdf.toFixed(2)} €`; level = "warn"; }
      }
      saveSnapshot(currentDepot === "combined" ? "ing" : currentDepot, { date: isoDate, dateDisplay: dateStr || isoToDisplay(isoDate), positions: rows, source: file.name });
      logStatus(`✓ ${file.name}: Stichtag ${dateStr || isoToDisplay(isoDate)}, ${rows.length} Position(en)${matchNote}`, level);
    } catch (err) {
      console.error(err);
      logStatus(`✗ ${file.name}: Fehler beim Verarbeiten (${err.message || err})`, "error");
    }
  }
  async function handleFiles(fileList) {
    for (const f of Array.from(fileList)) await processFile(f);
    renderDashboard();
  }

  // ============================================================
  // Dashboard-Rendering
  // ============================================================
  const dashboardEl = document.getElementById("dashboard");
  const headerSub = document.getElementById("headerSub");

  // ============================================================
  // Datenladung: Einzeldepot oder kombinierte Ansicht (ING + Trade Republic)
  // ============================================================
  function loadSingleDepotData(depotKey) {
    const cfg = DEPOTS[depotKey];
    const snapshotsObj = loadSnapshots(depotKey);
    const isoDates = Object.keys(snapshotsObj).sort();
    const deposits = loadDeposits(depotKey).sort((a, b) => a.date.localeCompare(b.date));
    const realSnapshots = isoDates.map((iso) => snapshotsObj[iso]);
    const currentPrices = loadCurrentPrices(depotKey);
    const todaySnap = realSnapshots.length ? computeTodaySnapshot(realSnapshots, deposits, currentPrices) : null;
    const snapshots = todaySnap ? [...realSnapshots, todaySnap] : realSnapshots.slice();
    let latest = snapshots.length ? snapshots[snapshots.length - 1] : null;
    const first = snapshots.length ? snapshots[0] : null;
    let latestReal = realSnapshots.length ? realSnapshots[realSnapshots.length - 1] : null;

    const manualPositions = loadManualPositions(depotKey);
    if (manualPositions.length && latest) {
      latest = applyManualPositions(latest, manualPositions, currentPrices);
      snapshots[snapshots.length - 1] = latest;
      latestReal = todaySnap ? applyManualPositions(latestReal, manualPositions, currentPrices) : latest;
    }
    return { depot: depotKey, cfg, snapshotsObj, isoDates, deposits, realSnapshots, currentPrices, todaySnap, snapshots, latest, first, latestReal, manualPositions };
  }

  // Findet den neuesten Snapshot eines (nach Datum sortierten) Arrays mit date <= gegebenem Datum
  function snapshotAtOrBefore(sortedSnapshots, date) {
    let best = null;
    for (const s of sortedSnapshots) {
      if (s.date <= date) best = s; else break;
    }
    return best;
  }

  function loadCombinedData() {
    const ing = loadSingleDepotData("ing");
    const tr = loadSingleDepotData("tr");
    const deposits = [...ing.deposits, ...tr.deposits].sort((a, b) => a.date.localeCompare(b.date));

    const allDates = Array.from(new Set([...ing.snapshots.map((s) => s.date), ...tr.snapshots.map((s) => s.date)])).sort();
    const combinedSnapshots = allDates.map((date) => {
      const ingSnap = snapshotAtOrBefore(ing.snapshots, date);
      const trSnap = snapshotAtOrBefore(tr.snapshots, date);
      const posByIsin = {};
      for (const snap of [ingSnap, trSnap]) {
        if (!snap) continue;
        for (const p of snap.positions) {
          if (!posByIsin[p.ISIN]) posByIsin[p.ISIN] = { Bezeichnung: p.Bezeichnung, ISIN: p.ISIN, WKN: p.WKN || "", Stueck: 0, Kurswert: 0 };
          posByIsin[p.ISIN].Stueck += p.Stueck;
          posByIsin[p.ISIN].Kurswert += p.Kurswert;
        }
      }
      return { date, dateDisplay: isoToDisplay(date), positions: Object.values(posByIsin), source: "Kombiniert aus ING DiBa + Trade Republic" };
    });

    const latest = combinedSnapshots.length ? combinedSnapshots[combinedSnapshots.length - 1] : null;
    const first = combinedSnapshots.length ? combinedSnapshots[0] : null;
    return {
      depot: "combined", cfg: { label: "Gesamtübersicht", supportsPdfUpload: false },
      snapshotsObj: null, isoDates: allDates, deposits, realSnapshots: combinedSnapshots, currentPrices: {},
      todaySnap: null, snapshots: combinedSnapshots, latest, first, latestReal: latest,
      _ing: ing, _tr: tr,
    };
  }

  function loadViewData() {
    return currentDepot === "combined" ? loadCombinedData() : loadSingleDepotData(currentDepot);
  }

  // ============================================================
  // Auf-/Zuklappbare Karten (Uebersichten, Graphen, Konten-Bereiche).
  // Wickelt automatisch den Inhalt jeder .card (nach der <h2>-Ueberschrift)
  // in einen umschaltbaren Body - keine Template-Aenderung pro Karte noetig.
  // Zustand wird pro Ansicht/Tab + Kartenposition gespeichert (localStorage),
  // bleibt also ueber Neuladen und Re-Renders erhalten.
  // ============================================================
  let collapsedCards = {};
  try { collapsedCards = JSON.parse(localStorage.getItem("ui:collapsedCards") || "{}"); } catch (e) { collapsedCards = {}; }
  function saveCollapsedCards() {
    try { localStorage.setItem("ui:collapsedCards", JSON.stringify(collapsedCards)); } catch (e) {}
  }
  function makeCardsCollapsible(container) {
    const scopePrefix = currentDepot + ":" + activeTab + ":";
    const cards = container.querySelectorAll(".card");
    cards.forEach((card, idx) => {
      const h2 = card.querySelector(":scope > h2");
      if (!h2) return; // Karten ohne Ueberschrift (z.B. Leer-/Ladezustaende) bleiben immer sichtbar
      const cardKey = scopePrefix + idx;
      const bodyChildren = [...card.children].filter((c) => c !== h2);
      if (!bodyChildren.length) return;
      const bodyWrap = document.createElement("div");
      bodyWrap.className = "card-body";
      bodyChildren.forEach((c) => bodyWrap.appendChild(c));
      card.appendChild(bodyWrap);

      h2.classList.add("card-toggle-header");
      const titleWrap = document.createElement("span");
      titleWrap.className = "card-title-text";
      while (h2.firstChild) titleWrap.appendChild(h2.firstChild);
      h2.appendChild(titleWrap);
      const chevron = document.createElement("span");
      chevron.className = "card-toggle-icon";
      h2.appendChild(chevron);

      const setCollapsed = (collapsed) => {
        bodyWrap.style.display = collapsed ? "none" : "";
        chevron.textContent = collapsed ? "▸" : "▾";
        h2.classList.toggle("collapsed", collapsed);
      };
      setCollapsed(!!collapsedCards[cardKey]);

      h2.addEventListener("click", () => {
        const collapsed = bodyWrap.style.display !== "none";
        setCollapsed(collapsed);
        collapsedCards[cardKey] = collapsed;
        saveCollapsedCards();
      });
    });
  }

  // Wandelt jede .note-Hinweisbox (gelbe Anmerkungen) in ein kleines tippbares
  // Icon um. Tippen zeigt die Anmerkung an, erneutes Tippen auf das Icon ODER
  // irgendwo anders auf dem Bildschirm blendet sie wieder aus.
  function makeNotesCollapsible(container) {
    container.querySelectorAll(".note").forEach((note) => {
      if (note.classList.contains("note-bubble")) return; // bereits verarbeitet
      const originalHtml = note.innerHTML;
      const wrap = document.createElement("div");
      wrap.className = "note-collapsed-wrap";
      const icon = document.createElement("button");
      icon.type = "button";
      icon.className = "note-icon-toggle";
      icon.innerHTML = "💡";
      icon.setAttribute("aria-label", "Hinweis anzeigen");
      const bubble = document.createElement("div");
      bubble.className = "note note-bubble";
      bubble.innerHTML = originalHtml;
      bubble.style.display = "none";
      wrap.appendChild(icon);
      wrap.appendChild(bubble);
      note.replaceWith(wrap);

      function closeBubble() {
        bubble.style.display = "none";
        document.removeEventListener("click", outsideClickHandler, true);
      }
      function outsideClickHandler() { closeBubble(); }

      icon.addEventListener("click", (e) => {
        e.stopPropagation();
        const isOpen = bubble.style.display !== "none";
        if (isOpen) {
          closeBubble();
        } else {
          bubble.style.display = "block";
          setTimeout(() => document.addEventListener("click", outsideClickHandler, true), 0);
        }
      });
      bubble.addEventListener("click", (e) => e.stopPropagation());
    });
  }

  function renderAccountView(accountId) {
    const acc = ACCOUNTS[accountId];
    const txns = loadAccountTransactions(accountId);
    const rules = loadRecurringRules(accountId);
    const todayIso = todayIsoLocal();
    const txnYears = Array.from(new Set(txns.map((t) => t.date.slice(0, 4)))).sort().reverse();
    const balance = computeAccountBalance(accountId, todayIso);
    const changeAbs = balance - acc.startBalance;

    headerSub.textContent = `${acc.icon} ${acc.label} · ${txns.length} Buchung(en) · Start ${isoToDisplay(acc.startDate)}: ${fmtEur(acc.startBalance)}`;

    // ---- Kontostand-Verlauf (kumuliert ab Startsaldo) ----
    const sortedTxns = [...txns].sort((a, b) => a.date.localeCompare(b.date));
    const balancePoints = [{ date: acc.startDate, balance: acc.startBalance }];
    let running = acc.startBalance;
    for (const t of sortedTxns) { running += t.amount; balancePoints.push({ date: t.date, balance: running }); }
    if (balancePoints[balancePoints.length - 1].date < todayIso) balancePoints.push({ date: todayIso, balance: running });

    // ---- Kategorien-Aufschluesselung (Ausgaben, letzte 90 Tage) ----
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 90);
    const cutoffIso = cutoff.toISOString().slice(0, 10);
    const catTotals = {};
    for (const t of txns) {
      if (t.amount < 0 && t.type === "expense" && t.date >= cutoffIso) {
        catTotals[t.category || "Sonstiges"] = (catTotals[t.category || "Sonstiges"] || 0) + Math.abs(t.amount);
      }
    }
    const catBreakdown = Object.entries(catTotals).map(([label, amount]) => ({ label, amount })).sort((a, b) => b.amount - a.amount);

    // ---- Buchungen-Tabelle ----
    const typeLabel = { expense: "Ausgabe", income: "Einnahme", transfer_out: "Umbuchung →", transfer_in: "Umbuchung ←", invest_out: "Depot-Einzahlung →" };
    const txnRows = [...txns].sort((a, b) => b.date.localeCompare(a.date)).map((t) => {
      const searchText = [isoToDisplay(t.date), fmtEur(t.amount), typeLabel[t.type] || t.type, t.category || "", t.note || ""].join(" ").toLowerCase();
      return `
      <tr data-date="${t.date}" data-search="${searchText.replace(/"/g, "&quot;")}">
        <td>${isoToDisplay(t.date)}</td>
        <td class="num" style="color:${t.amount >= 0 ? "var(--positive)" : "var(--negative)"}">${t.amount >= 0 ? "+" : ""}${fmtEur(t.amount)}</td>
        <td>${typeLabel[t.type] || t.type}</td>
        <td>${t.category || ""}</td>
        <td>${t.note || ""}${t.recurringId ? ' <span class="est-badge">Dauerauftrag</span>' : ""}</td>
        <td style="text-align:right"><button class="del-btn" data-del-txn="${t.id}" title="Löschen">🗑</button></td>
      </tr>`;
    }).join("");

    // ---- Daueraufträge-Tabelle ----
    const ruleRows = rules.map((r) => {
      let targetLabel = r.category || "";
      if (r.type === "invest" && r.targetDepot) {
        const depotData = loadSingleDepotData(r.targetDepot);
        const etfName = r.targetIsin && depotData.latestReal ? (depotData.latestReal.positions.find((p) => p.ISIN === r.targetIsin) || {}).Bezeichnung : null;
        targetLabel = `📈 ${DEPOTS[r.targetDepot].label}${etfName ? " → " + etfName : " (anteilig)"}`;
      }
      return `
      <tr>
        <td>${r.label}</td>
        <td class="num" style="color:${r.amount >= 0 ? "var(--positive)" : "var(--negative)"}">${r.amount >= 0 ? "+" : ""}${fmtEur(r.amount)}</td>
        <td>${targetLabel}</td>
        <td class="num">${r.dayOfMonth}.</td>
        <td>${r.active ? "aktiv" : "pausiert"}</td>
        <td style="text-align:right">
          <button class="del-btn" data-edit-rule="${r.id}" title="Bearbeiten">✏️</button>
          <button class="del-btn" data-toggle-rule="${r.id}" title="${r.active ? "Pausieren" : "Aktivieren"}">${r.active ? "⏸" : "▶️"}</button>
          <button class="del-btn" data-del-rule="${r.id}" title="Löschen">🗑</button>
        </td>
      </tr>`;
    }).join("");

    const editingRule = editingRuleId ? rules.find((r) => r.id === editingRuleId) : null;
    const escAttr = (s) => String(s == null ? "" : s).replace(/"/g, "&quot;");

    const otherAccounts = Object.keys(ACCOUNTS).filter((k) => k !== accountId);

    dashboardEl.innerHTML = `
      <div class="tabs">
        <button class="tab-btn ${activeTab === "overview" ? "active" : ""}" data-tab="overview">📊 Übersicht</button>
        <button class="tab-btn ${activeTab === "data" ? "active" : ""}" data-tab="data">🧾 Transaktionen &amp; Daueraufträge</button>
      </div>

      <div class="tab-panel" id="tab-overview" style="display:${activeTab === "overview" ? "block" : "none"}">
        <div class="hero-card">
          <div class="hero-label">${acc.icon} Kontostand · ${acc.label}</div>
          <div class="hero-value">${fmtEur(balance)}</div>
          <span class="hero-badge ${changeAbs >= 0 ? "positive" : "negative"}">${changeAbs >= 0 ? "+" : ""}${fmtEur(changeAbs)} seit ${isoToDisplay(acc.startDate)}</span>
          <div id="balanceChart"></div>
          ${rangeSelectorHtml()}
        </div>
        <div class="card">
          <h2>Ausgaben nach Kategorie <span class="sub-h2">– letzte 90 Tage</span></h2>
          ${catBreakdown.length ? `<div id="categoryChart"></div>` : `<div class="empty" style="padding:16px">Noch keine Ausgaben in diesem Zeitraum.</div>`}
        </div>
      </div>

      <div class="tab-panel" id="tab-data" style="display:${activeTab === "data" ? "block" : "none"}">
        <div class="card">
          <h2>Buchung hinzufügen</h2>
          <div class="deposit-form">
            <div class="field"><label>Datum</label><input type="date" id="txnDate" value="${todayIso}"></div>
            <div class="field"><label>Betrag (€)</label><input type="number" id="txnAmount" step="0.01" min="0" placeholder="z.B. 24,90"></div>
            <div class="field"><label>Art</label>
              <select id="txnType">
                <option value="expense">Ausgabe</option>
                <option value="income">Einnahme</option>
                <option value="transfer">Umbuchung zu anderem Konto</option>
                <option value="invest">Einzahlung in Depot (ETF Sparplan)</option>
              </select>
            </div>
            <div class="field" id="txnCategoryField"><label>Kategorie</label>
              <select id="txnCategory">${EXPENSE_CATEGORIES.map((c) => `<option value="${c}">${c}</option>`).join("")}</select>
            </div>
            <div class="field" id="txnTargetAccField" style="display:none"><label>Zielkonto</label>
              <select id="txnTargetAcc">${otherAccounts.map((k) => `<option value="${k}">${ACCOUNTS[k].icon} ${ACCOUNTS[k].label}</option>`).join("")}</select>
            </div>
            <div class="field" id="txnTargetDepotField" style="display:none"><label>Zieldepot</label>
              <select id="txnTargetDepot">${Object.keys(DEPOTS).map((k) => `<option value="${k}">${DEPOTS[k].label}</option>`).join("")}</select>
            </div>
            <div class="field" id="txnTargetIsinField" style="display:none"><label>Ziel-ETF</label>
              <select id="txnTargetIsin"><option value="">Gesamtes Depot (anteilig)</option></select>
            </div>
            <div class="field"><label>Notiz (optional)</label><input type="text" id="txnNote" placeholder="z.B. Wocheneinkauf"></div>
            <button class="btn primary" id="addTxnBtn">+ Buchung hinzufügen</button>
          </div>
          <div class="txn-filter-bar">
            <div class="txn-filter-quick">
              <select id="txnFilterYear" title="Jahr">
                <option value="">Alle Jahre</option>
                ${txnYears.map((y) => `<option value="${y}" ${txnFilterState.year === y ? "selected" : ""}>${y}</option>`).join("")}
              </select>
              <select id="txnFilterMonth" title="Monat">
                <option value="">Alle Monate</option>
                ${MONTH_NAMES.map((name, i) => { const mm = String(i + 1).padStart(2, "0"); return `<option value="${mm}" ${txnFilterState.month === mm ? "selected" : ""}>${name}</option>`; }).join("")}
              </select>
            </div>
            <input type="text" id="txnSearch" placeholder="🔍 Suche (Kategorie, Notiz, Betrag) …" value="${txnFilterState.query.replace(/"/g, "&quot;")}">
            <div class="txn-filter-dates">
              <input type="date" id="txnFilterFrom" value="${txnFilterState.from}" title="Von">
              <span>–</span>
              <input type="date" id="txnFilterTo" value="${txnFilterState.to}" title="Bis">
            </div>
            <button class="btn" id="txnFilterReset">Zurücksetzen</button>
            <span id="txnFilterCount" class="sub-h2"></span>
          </div>
          ${txns.length ? `<div class="table-wrap table-wrap-scroll"><table id="txnTable">
            <thead><tr><th>Datum</th><th class="num">Betrag</th><th>Art</th><th>Kategorie</th><th>Notiz</th><th></th></tr></thead>
            <tbody>${txnRows}</tbody>
          </table></div>` : `<div class="empty" style="padding:16px">Noch keine Buchungen.</div>`}
        </div>

        <div class="card">
          <h2>Daueraufträge <span class="sub-h2">– werden automatisch monatlich gebucht</span></h2>
          <div class="deposit-form">
            ${editingRule ? `<div class="note" style="margin:0 0 4px; flex-basis:100%;">✏️ Du bearbeitest „${escAttr(editingRule.label)}" – Änderungen speichern oder abbrechen.</div>` : ""}
            <div class="field"><label>Bezeichnung</label><input type="text" id="ruleLabel" placeholder="z.B. Miete oder ETF Sparplan" value="${editingRule ? escAttr(editingRule.label) : ""}"></div>
            <div class="field"><label>Betrag (€)</label><input type="number" id="ruleAmount" step="0.01" min="0" placeholder="z.B. 800" value="${editingRule ? Math.abs(editingRule.amount) : ""}"></div>
            <div class="field"><label>Art</label>
              <select id="ruleType">
                <option value="expense" ${editingRule && editingRule.type === "expense" ? "selected" : ""}>Ausgabe</option>
                <option value="income" ${editingRule && editingRule.type === "income" ? "selected" : ""}>Einnahme</option>
                <option value="invest" ${editingRule && editingRule.type === "invest" ? "selected" : ""}>ETF Sparplan (Einzahlung in Depot)</option>
              </select>
            </div>
            <div class="field" id="ruleCategoryField"><label>Kategorie</label>
              <select id="ruleCategory">${EXPENSE_CATEGORIES.map((c) => `<option value="${c}" ${editingRule && editingRule.category === c ? "selected" : ""}>${c}</option>`).join("")}</select>
            </div>
            <div class="field" id="ruleTargetDepotField" style="display:none"><label>Zieldepot</label>
              <select id="ruleTargetDepot">${Object.keys(DEPOTS).map((k) => `<option value="${k}" ${editingRule && editingRule.targetDepot === k ? "selected" : ""}>${DEPOTS[k].label}</option>`).join("")}</select>
            </div>
            <div class="field" id="ruleTargetIsinField" style="display:none"><label>Ziel-ETF</label>
              <select id="ruleTargetIsin"><option value="">Gesamtes Depot (anteilig)</option></select>
            </div>
            <div class="field"><label>Tag im Monat</label><input type="number" id="ruleDay" min="1" max="28" value="${editingRule ? editingRule.dayOfMonth : 1}"></div>
            <button class="btn primary" id="addRuleBtn">${editingRule ? "💾 Änderungen speichern" : "+ Dauerauftrag anlegen"}</button>
            ${editingRule ? `<button class="btn" id="cancelRuleEditBtn" type="button">Abbrechen</button>` : ""}
          </div>
          ${rules.length ? `<div class="table-wrap"><table>
            <thead><tr><th>Bezeichnung</th><th class="num">Betrag</th><th>Ziel</th><th class="num">Tag</th><th>Status</th><th></th></tr></thead>
            <tbody>${ruleRows}</tbody>
          </table></div>` : `<div class="empty" style="padding:16px">Noch keine Daueraufträge.</div>`}
          <div class="note">Daueraufträge werden bei jedem Öffnen des Tools automatisch bis heute nachgebucht (max. 1× pro
          Fälligkeit) – du musst wiederkehrende Buchungen wie Miete, Abos oder deinen monatlichen ETF-Sparplan also nicht
          mehr manuell eintragen. Bei "ETF Sparplan" wird automatisch sowohl das Konto belastet als auch die passende
          Einzahlung im Zieldepot angelegt.</div>
        </div>
      </div>
    `;

    // ---- Plotly: Kontostand-Verlauf ----
    if (activeTab === "overview") {
      const pc = getPlotColors();
      const mob = isMobile();
      const chartXRange = computeChartXRange(todayIso);
      Plotly.newPlot("balanceChart", [{
        x: balancePoints.map((p) => p.date), y: balancePoints.map((p) => p.balance),
        mode: "lines", line: { color: pc.accent, width: 2, shape: "hv" },
        fill: "tozeroy", fillcolor: hexToRgba(pc.accent, 0.08),
        hovertemplate: "%{y:,.2f} €<extra>Kontostand</extra>",
      }], {
        height: mob ? 220 : 300, margin: { t: 10, l: mob ? 44 : 60, r: 20, b: 34 },
        hovermode: "x unified",
        hoverlabel: { bgcolor: pc.card, bordercolor: pc.grid, font: { color: pc.font, size: mob ? 10 : 12 } },
        yaxis: { title: "", tickformat: ",.0f", separatethousands: true, gridcolor: pc.grid, color: pc.font, automargin: true, tickfont: { size: mob ? 9.5 : 12 } },
        xaxis: { gridcolor: pc.grid, color: pc.font, automargin: true, type: "date", range: chartXRange || undefined, tickfont: { size: mob ? 9.5 : 12 } },
        font: { family: "Inter, sans-serif", size: mob ? 10 : 12, color: pc.font },
        plot_bgcolor: "rgba(0,0,0,0)", paper_bgcolor: "rgba(0,0,0,0)",
      }, { displaylogo: false, responsive: true });

      if (catBreakdown.length) {
        const catMax = Math.max(1, ...catBreakdown.map((c) => c.amount));
        Plotly.newPlot("categoryChart", [{
          type: "bar", orientation: "h",
          x: catBreakdown.map((c) => c.amount).reverse(), y: catBreakdown.map((c) => c.label).reverse(),
          marker: { color: pc.accent },
          text: catBreakdown.map((c) => fmtEur(c.amount)).reverse(), textposition: "outside", textfont: { size: mob ? 9.5 : 12 },
          cliponaxis: false, hovertemplate: "%{y}: %{x:,.2f} €<extra></extra>",
        }], {
          height: Math.max(mob ? 160 : 200, catBreakdown.length * (mob ? 34 : 40)), margin: { t: 10, l: mob ? 100 : 140, r: mob ? 50 : 70, b: 26 },
          xaxis: { range: [0, catMax * 1.3], gridcolor: pc.grid, color: pc.font, automargin: true, tickfont: { size: mob ? 9 : 12 } },
          yaxis: { color: pc.font, automargin: true, tickfont: { size: mob ? 9.5 : 12 } },
          hoverlabel: { bgcolor: pc.card, bordercolor: pc.grid, font: { color: pc.font, size: mob ? 10 : 12 } },
          font: { family: "Inter, sans-serif", size: mob ? 10 : 12, color: pc.font },
          plot_bgcolor: "rgba(0,0,0,0)", paper_bgcolor: "rgba(0,0,0,0)",
        }, { displaylogo: false, responsive: true });
      }
    }

    // ---- Event handlers ----
    dashboardEl.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => { activeTab = btn.getAttribute("data-tab"); renderDashboard(); });
    });
    dashboardEl.querySelectorAll(".range-btn").forEach((btn) => {
      btn.addEventListener("click", () => { chartRange = btn.getAttribute("data-range"); customRangeFrom = null; customRangeTo = null; renderDashboard(); });
    });
    const rangeFromEl = document.getElementById("rangeFrom");
    const rangeToEl = document.getElementById("rangeTo");
    if (rangeFromEl && rangeToEl) {
      const applyCustomRange = () => {
        if (rangeFromEl.value && rangeToEl.value) { customRangeFrom = rangeFromEl.value; customRangeTo = rangeToEl.value; chartRange = "custom"; renderDashboard(); }
      };
      rangeFromEl.addEventListener("change", applyCustomRange);
      rangeToEl.addEventListener("change", applyCustomRange);
    }

    const txnTypeEl = document.getElementById("txnType");
    const catField = document.getElementById("txnCategoryField");
    const catSelect = document.getElementById("txnCategory");
    const targetAccField = document.getElementById("txnTargetAccField");
    const targetDepotField = document.getElementById("txnTargetDepotField");
    const targetIsinField = document.getElementById("txnTargetIsinField");
    const targetDepotSelect = document.getElementById("txnTargetDepot");
    const targetIsinSelect = document.getElementById("txnTargetIsin");

    function populateIsinOptions() {
      const depotKey = targetDepotSelect.value;
      const depotData = loadSingleDepotData(depotKey);
      const positions = depotData.latestReal ? depotData.latestReal.positions : [];
      targetIsinSelect.innerHTML = `<option value="">Gesamtes Depot (anteilig)</option>` +
        positions.map((p) => `<option value="${p.ISIN}">${p.Bezeichnung}</option>`).join("");
    }
    function updateTxnFormVisibility() {
      const type = txnTypeEl.value;
      catField.style.display = (type === "expense" || type === "income") ? "" : "none";
      catSelect.innerHTML = (type === "income" ? INCOME_CATEGORIES : EXPENSE_CATEGORIES).map((c) => `<option value="${c}">${c}</option>`).join("");
      targetAccField.style.display = type === "transfer" ? "" : "none";
      targetDepotField.style.display = type === "invest" ? "" : "none";
      targetIsinField.style.display = type === "invest" ? "" : "none";
      if (type === "invest") populateIsinOptions();
    }
    if (txnTypeEl) {
      txnTypeEl.addEventListener("change", updateTxnFormVisibility);
      targetDepotSelect.addEventListener("change", populateIsinOptions);
      updateTxnFormVisibility();
    }

    const addTxnBtn = document.getElementById("addTxnBtn");
    if (addTxnBtn) {
      addTxnBtn.addEventListener("click", () => {
        const date = document.getElementById("txnDate").value;
        const amount = parseFloat(document.getElementById("txnAmount").value);
        const type = txnTypeEl.value;
        const note = document.getElementById("txnNote").value.trim();
        if (!date || !amount || amount <= 0) { alert("Bitte Datum und einen positiven Betrag angeben."); return; }
        if (type === "expense") {
          addAccountTransaction(accountId, { id: uid(), date, amount: -amount, type: "expense", category: catSelect.value, note });
        } else if (type === "income") {
          addAccountTransaction(accountId, { id: uid(), date, amount: amount, type: "income", category: catSelect.value, note });
        } else if (type === "transfer") {
          processTransfer(accountId, amount, date, note, targetAccField.querySelector("select").value, null, null);
        } else if (type === "invest") {
          processTransfer(accountId, amount, date, note, null, targetDepotSelect.value, targetIsinSelect.value || null);
        }
        renderDashboard();
      });
    }
    dashboardEl.querySelectorAll("[data-del-txn]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-del-txn");
        saveAccountTransactions(accountId, loadAccountTransactions(accountId).filter((t) => t.id !== id));
        renderDashboard();
      });
    });

    // ---- Buchungen filtern/durchsuchen (live, ohne Re-Render damit der Fokus im Suchfeld bleibt) ----
    function applyTxnFilter() {
      const table = document.getElementById("txnTable");
      if (!table) return;
      const query = txnFilterState.query.toLowerCase().trim();
      const from = txnFilterState.from;
      const to = txnFilterState.to;
      let visible = 0, total = 0;
      table.querySelectorAll("tbody tr").forEach((row) => {
        total++;
        const date = row.getAttribute("data-date") || "";
        const search = row.getAttribute("data-search") || "";
        const match = (!query || search.includes(query)) && (!from || date >= from) && (!to || date <= to);
        row.style.display = match ? "" : "none";
        if (match) visible++;
      });
      const countEl = document.getElementById("txnFilterCount");
      if (countEl) countEl.textContent = (query || from || to) ? `${visible} von ${total} Buchungen` : `${total} Buchung(en)`;
    }
    const txnSearchEl = document.getElementById("txnSearch");
    const txnFilterFromEl = document.getElementById("txnFilterFrom");
    const txnFilterToEl = document.getElementById("txnFilterTo");
    const txnFilterResetEl = document.getElementById("txnFilterReset");
    const txnFilterYearEl = document.getElementById("txnFilterYear");
    const txnFilterMonthEl = document.getElementById("txnFilterMonth");
    function applyYearMonthQuickFilter() {
      const year = txnFilterYearEl.value;
      const month = txnFilterMonthEl.value;
      txnFilterState.year = year;
      txnFilterState.month = month;
      if (!year) {
        txnFilterState.from = ""; txnFilterState.to = "";
      } else if (!month) {
        txnFilterState.from = `${year}-01-01`; txnFilterState.to = `${year}-12-31`;
      } else {
        const lastDay = new Date(Number(year), Number(month), 0).getDate();
        txnFilterState.from = `${year}-${month}-01`; txnFilterState.to = `${year}-${month}-${String(lastDay).padStart(2, "0")}`;
      }
      txnFilterFromEl.value = txnFilterState.from; txnFilterToEl.value = txnFilterState.to;
      applyTxnFilter();
    }
    if (txnSearchEl) {
      txnSearchEl.addEventListener("input", () => { txnFilterState.query = txnSearchEl.value; applyTxnFilter(); });
      txnFilterFromEl.addEventListener("change", () => { txnFilterState.from = txnFilterFromEl.value; txnFilterState.year = ""; txnFilterState.month = ""; txnFilterYearEl.value = ""; txnFilterMonthEl.value = ""; applyTxnFilter(); });
      txnFilterToEl.addEventListener("change", () => { txnFilterState.to = txnFilterToEl.value; txnFilterState.year = ""; txnFilterState.month = ""; txnFilterYearEl.value = ""; txnFilterMonthEl.value = ""; applyTxnFilter(); });
      txnFilterYearEl.addEventListener("change", applyYearMonthQuickFilter);
      txnFilterMonthEl.addEventListener("change", applyYearMonthQuickFilter);
      txnFilterResetEl.addEventListener("click", () => {
        txnFilterState = { query: "", from: "", to: "", year: "", month: "" };
        txnSearchEl.value = ""; txnFilterFromEl.value = ""; txnFilterToEl.value = "";
        txnFilterYearEl.value = ""; txnFilterMonthEl.value = "";
        applyTxnFilter();
      });
      applyTxnFilter(); // aktiven Filter nach Re-Render (z.B. nach Loeschen) wieder anwenden
    }

    const addRuleBtn = document.getElementById("addRuleBtn");
    const ruleTypeEl = document.getElementById("ruleType");
    const ruleCategoryField = document.getElementById("ruleCategoryField");
    const ruleTargetDepotField = document.getElementById("ruleTargetDepotField");
    const ruleTargetIsinField = document.getElementById("ruleTargetIsinField");
    const ruleTargetDepotSelect = document.getElementById("ruleTargetDepot");
    const ruleTargetIsinSelect = document.getElementById("ruleTargetIsin");
    function populateRuleIsinOptions() {
      const depotKey = ruleTargetDepotSelect.value;
      const depotData = loadSingleDepotData(depotKey);
      const positions = depotData.latestReal ? depotData.latestReal.positions : [];
      ruleTargetIsinSelect.innerHTML = `<option value="">Gesamtes Depot (anteilig)</option>` +
        positions.map((p) => `<option value="${p.ISIN}">${p.Bezeichnung}</option>`).join("");
    }
    function updateRuleFormVisibility() {
      const type = ruleTypeEl.value;
      ruleCategoryField.style.display = type === "invest" ? "none" : "";
      ruleTargetDepotField.style.display = type === "invest" ? "" : "none";
      ruleTargetIsinField.style.display = type === "invest" ? "" : "none";
      if (type === "invest") populateRuleIsinOptions();
    }
    if (ruleTypeEl) {
      ruleTypeEl.addEventListener("change", updateRuleFormVisibility);
      ruleTargetDepotSelect.addEventListener("change", populateRuleIsinOptions);
      updateRuleFormVisibility();
      if (editingRule && editingRule.type === "invest") {
        ruleTargetDepotSelect.value = editingRule.targetDepot || "";
        populateRuleIsinOptions();
        ruleTargetIsinSelect.value = editingRule.targetIsin || "";
      }
    }
    if (addRuleBtn) {
      addRuleBtn.addEventListener("click", () => {
        const label = document.getElementById("ruleLabel").value.trim();
        const amountVal = parseFloat(document.getElementById("ruleAmount").value);
        const type = ruleTypeEl.value;
        const category = document.getElementById("ruleCategory").value;
        const day = Math.min(28, Math.max(1, parseInt(document.getElementById("ruleDay").value, 10) || 1));
        if (!label || !amountVal || amountVal <= 0) { alert("Bitte Bezeichnung und einen positiven Betrag angeben."); return; }
        const rules2 = loadRecurringRules(accountId);
        const targetDepot = type === "invest" ? ruleTargetDepotSelect.value : null;
        const targetIsin = type === "invest" ? (ruleTargetIsinSelect.value || null) : null;
        const amount = type === "expense" ? -amountVal : amountVal;
        if (editingRuleId) {
          const rule = rules2.find((r) => r.id === editingRuleId);
          if (rule) {
            Object.assign(rule, { label, amount, type, category: type === "invest" ? null : category, dayOfMonth: day, targetDepot, targetIsin });
          }
          editingRuleId = null;
        } else {
          rules2.push({
            id: uid(), label, amount, type,
            category: type === "invest" ? null : category, dayOfMonth: day,
            targetDepot, targetIsin,
            active: true, startDate: todayIso, lastProcessed: null,
          });
        }
        saveRecurringRules(accountId, rules2);
        renderDashboard();
      });
    }
    const cancelRuleEditBtn = document.getElementById("cancelRuleEditBtn");
    if (cancelRuleEditBtn) {
      cancelRuleEditBtn.addEventListener("click", () => {
        editingRuleId = null;
        renderDashboard();
      });
    }
    dashboardEl.querySelectorAll("[data-edit-rule]").forEach((btn) => {
      btn.addEventListener("click", () => {
        editingRuleId = btn.getAttribute("data-edit-rule");
        renderDashboard();
      });
    });
    dashboardEl.querySelectorAll("[data-toggle-rule]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-toggle-rule");
        const rules2 = loadRecurringRules(accountId);
        const rule = rules2.find((r) => r.id === id);
        if (rule) rule.active = !rule.active;
        saveRecurringRules(accountId, rules2);
        renderDashboard();
      });
    });
    dashboardEl.querySelectorAll("[data-del-rule]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-del-rule");
        if (editingRuleId === id) editingRuleId = null;
        saveRecurringRules(accountId, loadRecurringRules(accountId).filter((r) => r.id !== id));
        renderDashboard();
      });
    });
    makeCardsCollapsible(dashboardEl);
    makeNotesCollapsible(dashboardEl);
  }

  function renderDashboard() {
    if (currentDepot === "combined") activeTab = "overview";
    processRecurringRules();
    if (isAccountId(currentDepot)) { renderAccountView(currentDepot); return; }
    const view = loadViewData();
    const { snapshotsObj, isoDates, deposits, realSnapshots, currentPrices, todaySnap, snapshots, latest, first, latestReal, cfg, manualPositions } = view;

    if (!latest) {
      headerSub.textContent = "Läuft komplett lokal in deinem Browser – keine Cloud, kein Account nötig.";
      dashboardEl.innerHTML = `<div class="card"><div class="empty">Noch keine Daten für ${cfg.label} vorhanden.${cfg.supportsPdfUpload ? " Lade im Reiter \"Einzahlungen & Rohdaten\" deine erste PDF hoch." : ""}</div></div>`;
      return;
    }

    headerSub.textContent = `${cfg.label} · ${isoDates.length} Stichtage · ${isoToDisplay(first.date)} – ${isoToDisplay(latest.date)} · ${latest.positions.length} Positionen aktuell` + (todaySnap ? " · inkl. heutiger Kurswerte" : "");

    const nameByIsin = {};
    for (const snap of snapshots) for (const p of snap.positions) nameByIsin[p.ISIN] = p.Bezeichnung;
    const allIsins = Object.keys(nameByIsin);
    const categoricalPalette = getTheme() === "dark" ? CATEGORICAL_DARK : CATEGORICAL_LIGHT;
    const colorByIsin = {};
    allIsins.forEach((isin, i) => (colorByIsin[isin] = categoricalPalette[i % categoricalPalette.length]));

    const totalNow = latest.positions.reduce((s, p) => s + p.Kurswert, 0);
    const totalDeposited = deposits.reduce((s, d) => s + d.amount, 0);
    const absGain = totalNow - totalDeposited;
    const simplePct = totalDeposited ? (totalNow / totalDeposited - 1) * 100 : null;
    const xirrPct = computeXirrPct(deposits, totalNow, latest.date);
    const estXirrPct = computeEstimatedXirrPct(snapshots, totalNow, latest.date);

    const latestSorted = [...latest.positions].sort((a, b) => b.Kurswert - a.Kurswert);

    // ---- Hero-Bereich (grosser Depotwert, Parqet-artig) ----
    const usingManual = deposits.length > 0;

    const renditeLabel = usingManual ? "Rendite p.a. (IRR)" : "Rendite p.a.";
    const gainForHero = usingManual ? absGain : null;
    const gainPctForHero = usingManual ? simplePct : renditeForHero;

    if (usingManual && gainForHero != null) {
      const cls = gainForHero >= 0 ? "positive" : "negative";
      const sign = gainForHero >= 0 ? "+" : "";
      heroBadge = `<span class="hero-badge ${cls}">${sign}${fmtEur(gainForHero)} · ${fmtPct(gainPctForHero)}</span>`;
    } else if (renditeForHero != null) {
      const cls = renditeForHero >= 0 ? "positive" : "negative";
      heroBadge = `<span class="hero-badge ${cls}">${fmtPct(renditeForHero)} p.a. <span class="est-badge">geschätzt</span></span>`;
    }
    const heroStats = `
      <div class="hero-stat"><div class="hs-label">Eingezahlt</div><div class="hs-value">${usingManual ? fmtEur(totalDeposited) : "– €"}</div></div>
      <div class="hero-stat"><div class="hs-label">${renditeLabel}</div><div class="hs-value ${renditeForHero == null ? "" : renditeForHero >= 0 ? "positive" : "negative"}">${renditeForHero == null ? "n/v" : fmtPct(renditeForHero)}</div></div>
      <div class="hero-stat"><div class="hs-label">Positionen</div><div class="hs-value">${latest.positions.length}</div></div>
      <div class="hero-stat"><div class="hs-label">Stichtage</div><div class="hs-value">${isoDates.length}</div></div>`;

    // ---- Deposits table ----
    const nameByIsinAll = {};
    for (const snap of snapshots) for (const p of snap.positions) nameByIsinAll[p.ISIN] = p.Bezeichnung;
    const depositRows = [...deposits].reverse().map((d) => `
      <tr>
        <td>${isoToDisplay(d.date)}</td>
        <td class="num">${fmtEur(d.amount)}</td>
        <td>${d.isin ? (nameByIsinAll[d.isin] || d.isin) : "Portfolio (anteilig)"}</td>
        <td>${d.note || ""}</td>
        <td style="text-align:right"><button class="del-btn" data-del-dep="${d.id}" title="Löschen">🗑</button></td>
      </tr>`).join("");

    // ---- Snapshot management rows (nicht relevant/nicht gerendert bei combined) ----
    const snapshotByIso = {};
    for (const s of realSnapshots) snapshotByIso[s.date] = s;
    const mgmtRows = [...isoDates].reverse().map((iso) => {
      const snap = snapshotByIso[iso];
      if (!snap) return "";
      const total = snap.positions.reduce((s, p) => s + p.Kurswert, 0);
      return `<tr>
        <td>${isoToDisplay(iso)}</td>
        <td class="num">${fmtEur(total)}</td>

        <td class="mono">${snap.source || ""}</td>
        <td style="text-align:right"><button class="del-btn" data-del-snap="${iso}" title="Stichtag löschen">🗑</button></td>
      </tr>`;
    }).join("");

    // ---- Position table rows ----
    const posRows = latestSorted.map((r) => {
      const weight = totalNow ? (r.Kurswert / totalNow) * 100 : 0;
      const color = colorByIsin[r.ISIN];
      return `<tr>
        <td><span class="dot" style="background:${color}"></span>${r.Bezeichnung}</td>
        <td class="mono">${r.ISIN}</td>

    const priceInputs = latestReal.positions.map((p) => `
      <div class="field">

    const regionBreakdown = computeBlendedBreakdown(latest.positions, REGION_WEIGHTS_BY_ISIN);

    let wealthOverviewHtml = "";

      });
      const accountRows = Object.keys(ACCOUNTS).map((k) => ({ icon: ACCOUNTS[k].icon, label: ACCOUNTS[k].label, value: computeAccountBalance(k, todayIsoW), kind: "Konto" }));

      wealthOverviewHtml = `

        <h2>Vermögensübersicht <span class="sub-h2">– alle Konten &amp; Depots auf einen Blick</span></h2>

          <thead><tr><th></th><th>Bezeichnung</th><th>Typ</th><th class="num">Wert</th><th class="num">Anteil</th></tr></thead>
          <tbody>
            ${allRows.map((r) => `<tr>
              <td>${r.icon}</td><td>${r.label}</td><td class="mono">${r.kind}</td>
              <td class="num">${fmtEur(r.value)}</td>
              <td class="num">${grandTotal ? (r.value / grandTotal * 100).toFixed(1) : "0.0"} %</td>
            </tr>`).join("")}
          </tbody>
          <tfoot><tr style="font-weight:700"><td></td><td>Gesamtvermögen</td><td></td><td class="num">${fmtEur(grandTotal)}</td><td class="num">100 %</td></tr></tfoot>
        </table></div>
      </div>`;
    }

    dashboardEl.innerHTML = `
      ${wealthOverviewHtml}
      <div class="tabs">
        <button class="tab-btn ${activeTab === "overview" ? "active" : ""}" data-tab="overview">📊 Übersicht</button>
        ${currentDepot !== "combined" ? `<button class="tab-btn ${activeTab === "data" ? "active" : ""}" data-tab="data">🗂 Einzahlungen &amp; Rohdaten</button>` : ""}
      </div>

      <div class="tab-panel" id="tab-overview" style="display:${activeTab === "overview" ? "block" : "none"}">
        <div class="hero-card">
          <div class="hero-top">
            <div>
              <div class="hero-label">Depotwert · Stand ${isoToDisplay(latest.date)}</div>
              <div class="hero-value">${fmtEur(totalNow)}</div>
              ${heroBadge}
            </div>
          </div>
          <div class="hero-stats">${heroStats}</div>
          <div id="depositChart"></div>
          ${rangeSelectorHtml()}
        </div>

        <div class="grid">
          <div class="card" style="margin-bottom:0">
            <h2>Depotwert-Zusammensetzung im Zeitverlauf</h2>
            <div id="areaChart"></div>
          </div>
          <div class="card" style="margin-bottom:0">
            <h2>Zusammensetzung aktuell</h2>
            <div id="donutChart"></div>
          </div>
        </div>
        <div style="height:16px"></div>

        <div class="grid">
          <div class="card" style="margin-bottom:0">
            <h2>Regionen-Gewichtung <span class="sub-h2">– geschätzt aus Index-Zusammensetzung</span></h2>
            <div id="regionChart"></div>
          </div>
          <div class="card" style="margin-bottom:0">
            <h2>Branchen-Gewichtung <span class="sub-h2">– geschätzt aus Index-Zusammensetzung</span></h2>

          </div>

        <div class="note" style="margin-top:14px">
          Regionen- und Branchengewichtung basieren auf den veröffentlichten MSCI-Index-Factsheets
          (MSCI World, MSCI Emerging Markets IMI, Stand 30.06.2026) für die zugrundeliegenden Indizes deiner
          ETFs – nicht auf Live-Fondsholdings. Das ist eine gute Näherung (beide MSCI-World-ETFs bilden
          denselben Index nach), aber keine exakte tagesaktuelle Aufstellung.
        </div>
        <div style="height:16px"></div>

        <div class="card">
          <h2>Positionen (Stand ${isoToDisplay(latest.date)}${todaySnap ? " <span class=\"est-badge\">aktualisiert</span>" : ""})</h2>
          <div class="table-wrap"><table>
            <thead><tr><th>Wertpapier</th><th>ISIN</th><th class="num">Stück</th><th class="num">Kurswert</th><th class="num">Gewichtung</th></tr></thead>
            <tbody>${posRows}</tbody>
          </table></div>
          <div class="note">
            "Rendite p.a." ist der interne Zinsfuß (XIRR) über alle Ein-/Auszahlungen und den aktuellen
            Depotwert – die zeitgewichtete, tatsächliche persönliche Rendite. Im Graphen oben wird sie
            zusätzlich als Linie an jedem Stichtag dargestellt (rechte Achse), damit du siehst, wie sie sich
            über die Zeit entwickelt hat. Ohne manuell eingetragene Einzahlungen wird sie automatisch aus
            den Stückzahl-Änderungen zwischen den Stichtagen geschätzt – das ist eine Näherung. Für die
            genaue Rendite trag im Reiter "Einzahlungen & Rohdaten" deine tatsächlichen Einzahlungen ein.
            <br><br>
            Warum schwankt die gelbe Rendite-Linie besonders am Anfang stark (z. B. zwischen -7 % und
            +19 %)? Das ist normal bei der IRR-Berechnung: Solange erst wenig Kapital eingezahlt und wenig
            Zeit vergangen ist, wirkt sich jede kleine Wertschwankung sehr stark auf die <b>annualisierte</b>
            Rendite aus – ein Kursrücksetzer kurz nach einer großen Einzahlung sieht dann nach einer riesigen
            Renditeschwankung aus, obwohl es in Euro nur ein kleiner Betrag ist. Mit wachsendem Kapital und
            längerer Anlagedauer beruhigt sich die Linie automatisch (wie du ab 2024 gut siehst).
            ${todaySnap ? `<br><br>Der Stand "${isoToDisplay(latest.date)}" ist <b>hochgerechnet</b>: Bestände aus dem letzten

        <div class="card">

          <div class="deposit-form">

  let resizeTimer = null;

      const active = document.activeElement;
      if (active && ["INPUT", "SELECT", "TEXTAREA"].includes(active.tagName)) return;
      const nowMobile = isMobile();
      const widthChanged = Math.abs(window.innerWidth - lastWidth) > 40;
      if (nowMobile !== lastWasMobile || widthChanged) {
        lastWasMobile = nowMobile;
        lastWidth = window.innerWidth;
